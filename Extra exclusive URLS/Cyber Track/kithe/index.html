<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" type="image/png" href="../public/cybertrackfavicon.png" />
<title>Cyber Track</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07070f; color: #e8f6ff; font-family: 'Courier New', monospace; overflow: hidden;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #hud { width: 100%; display: flex; gap: 8px; padding: 6px 10px; align-items: center; font-size: 13px; font-weight: 700; }
  #hud > div { flex: 1; min-width: 0; }
  .lab { font-size: 10px; color: #7fd6ff; letter-spacing: 1px; }
  .bar { height: 8px; background: #17182b; border: 1px solid #2a2c50; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; }
  #hpFill { background: linear-gradient(90deg, #ff2bd6, #00e5ff); }
  #boostFill { background: #ffd24d; }
  #stage { position: relative; flex: none; }
  canvas { display: block; background: #07070f; border-radius: 8px; }
  #banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: 34px; font-weight: 900; color: #fff; text-shadow: 0 0 12px #ff2bd6; pointer-events: none; }
  #pad { display: none; width: 100%; height: 130px; margin-top: 6px; padding: 6px 10px 10px; justify-content: space-between; align-items: stretch; gap: 8px; }
  body.touch #pad { display: flex; }
  .grp { display: flex; gap: 8px; flex: 1; }
  .btn { flex: 1; background: #12132a; border: 2px solid #2a2c50; border-radius: 16px; color: #e8f6ff; font-size: 15px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; text-align: center; touch-action: none; position: relative; overflow: hidden; }
  .btn.on { background: #ff2bd6; border-color: #ff8be9; }
  .btn.boost { border-color: #ffd24d; } .btn.fire { border-color: #ff8c5c; } .btn.brake { border-color: #5bc8ff; }
  .btn.fire { flex-direction: column; font-size: 13px; }
  .btn small { display: block; font-size: 10px; opacity: .8; }
  #overlay { position: fixed; inset: 0; background: rgba(7,7,15,.95); display: none; flex-direction: column; align-items: center; overflow-y: auto; padding: 16px 12px 26px; z-index: 20; touch-action: pan-y; }
  #overlay.show { display: flex; }
  .logo { font-size: 30px; font-weight: 900; letter-spacing: 3px; margin: 6px 0; }
  .logo b { color: #ff2bd6; } .logo span { color: #00e5ff; }
  .sub { color: #7fd6ff; font-size: 12px; margin-bottom: 12px; text-align: center; }
  .big { background: linear-gradient(135deg, #ff2bd6, #00e5ff); border: none; color: #07070f; font-weight: 900; font-family: inherit; font-size: 16px; padding: 12px 26px; border-radius: 12px; margin: 6px; min-width: 190px; }
  .big.alt { background: #12132a; color: #e8f6ff; border: 1px solid #2a2c50; }
  h2 { margin: 6px 0; font-size: 16px; color: #00e5ff; letter-spacing: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; max-width: 640px; margin-bottom: 10px; }
  .card { background: #12132a; border: 2px solid #2a2c50; border-radius: 12px; padding: 8px; width: 150px; text-align: left; font-size: 11px; touch-action: pan-y; }
  .card.sel { border-color: #ff2bd6; }
  .card.locked { opacity: .45; }
  .card .nm { font-weight: 800; font-size: 12px; color: #fff; }
  .card .mk { color: #7fd6ff; }
  .pips { color: #ffd24d; letter-spacing: 1px; }
  .sw { width: 30px; height: 30px; border-radius: 8px; border: 2px solid #2a2c50; }
  .sw.sel { border-color: #fff; }
  .chip { padding: 8px 12px; border-radius: 10px; border: 2px solid #2a2c50; background: #12132a; font-size: 12px; font-weight: 700; }
  .chip.sel { border-color: #00e5ff; color: #00e5ff; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><div class="lab">HP</div><div class="bar"><i id="hpFill"></i></div></div>
    <div><div class="lab">SPEED</div><div id="spd">0</div></div>
    <div><div class="lab">POS</div><div id="pos">1/10</div></div>
    <div><div class="lab">ALIVE · ELIM</div><div id="alive">10 · 20s</div></div>
    <div><div class="lab">BOOST</div><div class="bar"><i id="boostFill"></i></div></div>
  </div>
  <div id="stage"><canvas id="c"></canvas><div id="banner"></div></div>
  <div id="pad">
    <div class="grp"><div class="btn" data-act="left">&#9664;</div><div class="btn" data-act="right">&#9654;</div></div>
    <div class="grp"><div class="btn brake" data-act="brake">BRAKE</div><div class="btn boost" data-act="boost">BOOST</div><div class="btn fire" data-act="fire" id="fireBtn">FIRE<small id="fireSm">no item</small></div></div>
  </div>
</div>
<div id="overlay"></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d', { alpha: false });
const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || /pad=1/.test(location.search);
if (touch) document.body.classList.add('touch');

// ---------------------------------------------------------------- data
const VEHICLES = [
  { id: 'civic_type_r', name: 'CIVIC TYPE R', make: 'Honda', col: '#ff3344', accel: 28, top: 44, hand: 2.4, hp: 90, wins: 0 },
  { id: 'gr86', name: 'GR86', make: 'Toyota', col: '#cccccc', accel: 30, top: 46, hand: 2.8, hp: 85, wins: 3 },
  { id: 'skyline_r34', name: 'SKYLINE GT-R', make: 'Nissan', col: '#4488ff', accel: 34, top: 52, hand: 2.6, hp: 95, wins: 8 },
  { id: 'mustang_gt500', name: 'MUSTANG GT500', make: 'Ford', col: '#2255cc', accel: 38, top: 56, hand: 1.8, hp: 120, wins: 15 },
  { id: 'porsche_gt3', name: 'PORSCHE 911 GT3', make: 'Porsche', col: '#ffffff', accel: 36, top: 58, hand: 3.2, hp: 80, wins: 25 },
  { id: 'lambo_huracan', name: 'HURACAN EVO', make: 'Lamborghini', col: '#ffcc00', accel: 42, top: 64, hand: 2.4, hp: 90, wins: 40 },
  { id: 'ferrari_la', name: 'LaFERRARI', make: 'Ferrari', col: '#ff0000', accel: 46, top: 70, hand: 2.6, hp: 85, wins: 60 },
  { id: 'bugatti_chiron', name: 'CHIRON', make: 'Bugatti', col: '#1144cc', accel: 50, top: 80, hand: 2.0, hp: 100, wins: 100 },
  { id: 'f1_concept', name: 'F1 CONCEPT', make: 'Formula 1', col: '#ff0011', accel: 70, top: 110, hand: 3.4, hp: 50, wins: 150 },
];
const PAINTS = ['#00ffcc', '#00ddff', '#4488ff', '#8844ff', '#ff00ff', '#ff0044', '#ff8800', '#ffee00', '#44ff00', '#ffffff', '#999999', '#222233'];
const TRACKS = ['Neon Oval', 'Twister', 'Circuit 7', 'Kidney'];
const NAMES = ['NOVA', 'VIPER', 'ECHO', 'BLAZE', 'GHOST', 'RAZOR', 'HYDRA', 'ZERO', 'PIXEL', 'DRIFT', 'COMET', 'TURBO'];
const SPEED = 5.2;          // world px/s per unit of "top"
const ROAD = 250, CAR_R = 20, ELIM_EVERY = 20, FIRST_ELIM = 25, GRID = 10;

function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
let wins = parseInt(load('ct_wins', 0)) || 0;
let pick = load('ctl_vehicle', 'civic_type_r'), paint = load('ctl_paint', '#00ddff'), trackId = load('ctl_track', 0);
if (!VEHICLES.find((v) => v.id === pick && v.wins <= wins)) pick = 'civic_type_r';

// ---------------------------------------------------------------- track
let N = 0, PT = [], TAN = [], NRM = [], PATH = null;
function buildTrack(kind) {
  const R = 1000; N = 160; PT = []; TAN = []; NRM = [];
  for (let i = 0; i < N; i++) {
    const t = i / N * Math.PI * 2; let r = 1, sx = 1, sy = 1;
    if (kind === 0) { sx = 1.6; }
    else if (kind === 1) { r = 1 + 0.26 * Math.cos(3 * t) + 0.07 * Math.sin(2 * t); }
    else if (kind === 2) { r = 1 + 0.2 * Math.cos(2 * t + 0.5) + 0.13 * Math.sin(5 * t); sx = 1.3; }
    else { r = 1 + 0.3 * Math.cos(t) + 0.1 * Math.cos(4 * t); }
    PT.push({ x: Math.cos(t) * r * R * sx, y: Math.sin(t) * r * R * sy });
  }
  for (let i = 0; i < N; i++) {
    const a = PT[i], b = PT[(i + 1) % N], dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    TAN.push(Math.atan2(dy, dx)); NRM.push({ x: -dy / L, y: dx / L });
  }
  PATH = new Path2D();
  PT.forEach((p, i) => (i ? PATH.lineTo(p.x, p.y) : PATH.moveTo(p.x, p.y))); PATH.closePath();
}
function locate(c) {
  let best = 1e18, bi = c.idx, bt = 0, bl = 0;
  for (let k = -2; k <= 6; k++) {
    const i = (c.idx + k + N) % N, a = PT[i], b = PT[(i + 1) % N], dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy;
    let t = ((c.x - a.x) * dx + (c.y - a.y) * dy) / L2; t = t < 0 ? 0 : t > 1 ? 1 : t;
    const qx = a.x + dx * t - c.x, qy = a.y + dy * t - c.y, d2 = qx * qx + qy * qy;
    if (d2 < best) { best = d2; bi = i; bt = t; bl = ((c.x - a.x) * -dy + (c.y - a.y) * dx) / Math.sqrt(L2); }
  }
  if (c.idx > N * 0.75 && bi < N * 0.25) c.lap++; else if (c.idx < N * 0.25 && bi > N * 0.75) c.lap--;
  c.idx = bi; c.lat = bl; c.prog = c.lap * N + bi + bt;
}
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

// ---------------------------------------------------------------- state
let cars = [], player = null, pups = [], missiles = [], fx = [], state = 'garage', paused = false;
let elimT = FIRST_ELIM, countdown = 0, clock = 0, camAng = 0, camX = 0, camY = 0, viewW = 400, viewH = 400, zoom = 0.6, dpr = 1, banner = '';
const keys = { left: 0, right: 0, brake: 0, boost: 0, fire: 0 };

function makeCar(v, colr, name, isBot, slot) {
  const row = Math.floor(slot / 2), side = slot % 2 ? 1 : -1, idx = 10 - row;
  const p = PT[idx], n = NRM[idx];
  return { v, name, isBot, col: colr, x: p.x + n.x * side * 45, y: p.y + n.y * side * 45, ang: TAN[idx], speed: 0, idx, lap: 0, lat: 0, prog: idx,
    hp: v.hp, max: v.hp, boostT: 0, boostMeter: 100, shield: 0, item: null, spin: 0, dead: false, wallCd: 0, skill: 0.84 + Math.random() * 0.14,
    lane: (Math.random() - 0.5) * 90, steer: 0, place: 0, itemCd: 0 };
}
function startRace() {
  buildTrack(trackId);
  cars = []; missiles = []; fx = []; clock = 0; elimT = FIRST_ELIM;
  const pv = VEHICLES.find((v) => v.id === pick);
  player = makeCar(pv, paint, 'YOU', false, 5);
  cars.push(player);
  const slots = [0, 1, 2, 3, 4, 6, 7, 8, 9]; slots.forEach((s, i) => {
    const v = VEHICLES[Math.floor(Math.random() * Math.min(VEHICLES.length, 3 + Math.floor(wins / 8) + 2))];
    cars.push(makeCar(v, PAINTS[Math.floor(Math.random() * PAINTS.length)], NAMES[i % NAMES.length], true, s));
  });
  const kinds = ['boost', 'repair', 'shield', 'missile', 'boost', 'spike', 'oil', 'repair', 'missile', 'shield'];
  pups = kinds.map((k, i) => { const wi = Math.floor((i + 0.5) / kinds.length * N), n = NRM[wi], p = PT[wi], side = i % 2 ? 1 : -1; return { x: p.x + n.x * side * ROAD * 0.25, y: p.y + n.y * side * ROAD * 0.25, kind: k, on: true, t: 0 }; });
  cars.forEach(locate);
  camX = player.x; camY = player.y; camAng = player.ang;
  closeOverlay(); state = 'countdown'; countdown = 3.2; paused = false;
}
const PU = { boost: ['⚡', '#ffd24d'], repair: ['+', '#3ddc84'], shield: ['◇', '#5bc8ff'], missile: ['✦', '#ff8c5c'], spike: ['✖', '#ff3355'], oil: ['●', '#8855ff'] };

// ---------------------------------------------------------------- effects
function pop(x, y, col, n) { for (let i = 0; i < n; i++) fx.push({ x, y, vx: (Math.random() - .5) * 300, vy: (Math.random() - .5) * 300, life: 0.5, col }); }
function say(t, ms) { banner = t; $('banner').textContent = t; clearTimeout(say.t); say.t = setTimeout(() => { banner = ''; $('banner').textContent = ''; }, ms || 1500); }
function damage(c, d) {
  if (c.dead || d <= 0) return;
  if (c.shield > 0) { c.shield = 0; pop(c.x, c.y, '#5bc8ff', 10); return; }
  c.hp -= d; pop(c.x, c.y, '#ff4477', 5);
  if (c.hp <= 0) eliminate(c, 'WRECKED');
}
function eliminate(c, why) {
  if (c.dead) return;
  const aliveNow = cars.filter((x) => !x.dead).length;
  c.dead = true; c.hp = 0; c.place = aliveNow; pop(c.x, c.y, '#ffb000', 26);
  say((c === player ? 'YOU' : c.name) + ' ' + why, 1400);
  if (c === player) setTimeout(() => finish(false), 1200);
  else if (aliveNow - 1 === 1 && !player.dead) finish(true);
}
function finish(won) {
  if (state === 'over') return; state = 'over';
  const place = won ? 1 : player.place || 10;
  if (won) { wins++; save('ct_wins', wins); }
  const unlocked = VEHICLES.filter((v) => v.wins === wins && won).map((v) => v.name);
  overlay(`<div class="logo"><b>${won ? 'YOU' : 'RACE'}</b> <span>${won ? 'WIN!' : 'OVER'}</span></div>
    <div class="sub">${won ? 'Last car standing' : 'Eliminated in P' + place + ' of ' + GRID}<br>Total wins: ${wins}${unlocked.length ? '<br>🔓 Unlocked ' + unlocked.join(', ') : ''}</div>
    <button class="big" id="rAgain">Race Again</button><button class="big alt" id="rGarage">Garage</button>`);
  $('rAgain').onclick = startRace; $('rGarage').onclick = showGarage;
}

// ---------------------------------------------------------------- physics
function drive(c, dt, steerIn, throttle, brake) {
  const top = c.v.top * SPEED * (c.boostT > 0 ? 1.45 : 1) * (c.isBot ? c.skill : 1), acc = c.v.accel * 6 * (c.boostT > 0 ? 2 : 1);
  c.steer += (steerIn - c.steer) * Math.min(1, dt * 9);
  if (c.spin > 0) { c.spin -= dt; c.ang += dt * 9; c.speed *= 1 - dt * 1.5; }
  else {
    const grip = Math.min(1, c.speed / 140);
    c.ang += c.steer * (1.5 + c.v.hand * 0.4) * grip * dt * (c.speed < 0 ? -1 : 1);
  }
  if (brake) c.speed -= 600 * dt; else if (throttle) c.speed += (c.speed < top ? acc : -acc * 0.8) * dt; else c.speed -= 160 * dt;
  if (c.speed > top * 1.02 && !throttle) c.speed -= 200 * dt;
  c.speed = Math.max(-80, c.speed);
  c.x += Math.cos(c.ang) * c.speed * dt; c.y += Math.sin(c.ang) * c.speed * dt;
}
function walls(c, dt) {
  if (c.wallCd > 0) c.wallCd -= dt;
  locate(c);
  const lim = ROAD / 2 - CAR_R * 0.8;
  if (Math.abs(c.lat) > lim) {
    const sg = c.lat > 0 ? 1 : -1, over = Math.abs(c.lat) - lim, n = NRM[c.idx];
    c.x -= n.x * sg * over; c.y -= n.y * sg * over;
    const impact = Math.abs(c.speed * Math.sin(angDiff(c.ang, TAN[c.idx])));
    c.ang -= angDiff(c.ang, TAN[c.idx]) * 0.25; c.speed *= 0.82;
    if (impact > 90 && c.wallCd <= 0) { c.wallCd = 0.45; damage(c, 3 + impact * 0.035); pop(c.x, c.y, '#ffd24d', 4); }
  }
}
function botThink(c, dt) {
  const look = Math.ceil((c.speed * 0.45 + 120) / 47), ti = (c.idx + look) % N, n = NRM[ti];
  const tx = PT[ti].x + n.x * c.lane, ty = PT[ti].y + n.y * c.lane;
  const d = angDiff(Math.atan2(ty - c.y, tx - c.x), c.ang);
  let steer = Math.max(-1, Math.min(1, d * 2.6));
  // dodge slower cars directly ahead
  for (const o of cars) {
    if (o === c || o.dead) continue;
    const dx = o.x - c.x, dy = o.y - c.y, fwd = dx * Math.cos(c.ang) + dy * Math.sin(c.ang), side = -dx * Math.sin(c.ang) + dy * Math.cos(c.ang);
    if (fwd > 0 && fwd < 90 && Math.abs(side) < 34) steer += side > 0 ? -0.5 : 0.5;
  }
  const slow = Math.abs(d) > 0.55 && c.speed > c.v.top * SPEED * 0.55;
  drive(c, dt, steer, !slow, false);
  if (c.boostMeter >= 100 && Math.random() < 0.01) { c.boostT = 2; c.boostMeter = 0; }
  if (c.item === 'missile' && Math.random() < 0.05 && target(c)) fireMissile(c);
  useItem(c);
  if (Math.random() < dt * 0.4) c.lane = (Math.random() - 0.5) * 100;
}
function useItem(c) {
  if (c.item === 'boost') { c.boostT = 3; c.item = null; }
  else if (c.item === 'shield') { c.shield = 1; c.item = null; }
}
function target(c) {
  let best = null, bd = 700;
  for (const o of cars) {
    if (o === c || o.dead) continue;
    const dx = o.x - c.x, dy = o.y - c.y, d = Math.hypot(dx, dy);
    if (d < bd && Math.abs(angDiff(Math.atan2(dy, dx), c.ang)) < 0.6) { bd = d; best = o; }
  }
  return best;
}
function fireMissile(c) {
  if (c.item !== 'missile') return;
  c.item = null; missiles.push({ x: c.x, y: c.y, ang: c.ang, life: 1.8, owner: c, tgt: target(c) });
}
function pickups(c) {
  for (const p of pups) {
    if (!p.on) continue;
    if (Math.hypot(c.x - p.x, c.y - p.y) < 34) {
      p.on = false; p.t = 9;
      if (p.kind === 'repair') c.hp = Math.min(c.max, c.hp + 35);
      else if (p.kind === 'spike') damage(c, 20);
      else if (p.kind === 'oil') { c.spin = 1.1; }
      else if (p.kind === 'boost' || p.kind === 'shield') { c.item = p.kind; }
      else c.item = p.kind;
      pop(p.x, p.y, PU[p.kind][1], 8);
    }
  }
}

function update(dt) {
  clock += dt;
  for (const p of pups) if (!p.on && (p.t -= dt) <= 0) p.on = true;
  for (const c of cars) {
    if (c.dead) continue;
    if (c.boostT > 0) c.boostT -= dt;
    if (c.boostMeter < 100) c.boostMeter = Math.min(100, c.boostMeter + dt * 8);
    if (c.isBot) botThink(c, dt);
    else {
      const steer = keys.right - keys.left;
      if (keys.boost && c.boostMeter >= 100) { c.boostT = 2; c.boostMeter = 0; }
      if (keys.fire) { fireMissile(c); keys.fire = 0; }
      useItem(c);
      drive(c, dt, steer, !keys.brake, keys.brake);
    }
    walls(c, dt); pickups(c);
  }
  // car-to-car pushes
  for (let i = 0; i < cars.length; i++) {
    const a = cars[i]; if (a.dead) continue;
    for (let j = i + 1; j < cars.length; j++) {
      const b = cars[j]; if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      if (Math.abs(dx) > CAR_R * 2 || Math.abs(dy) > CAR_R * 2) continue;
      const d = Math.hypot(dx, dy);
      if (d < CAR_R * 2 && d > 0) {
        const nx = dx / d, ny = dy / d, ov = (CAR_R * 2 - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
        const rel = (a.speed - b.speed) * 0.4; a.speed -= rel; b.speed += rel;
      }
    }
  }
  for (const m of missiles) {
    m.life -= dt;
    if (m.tgt && !m.tgt.dead) m.ang += Math.max(-3 * dt, Math.min(3 * dt, angDiff(Math.atan2(m.tgt.y - m.y, m.tgt.x - m.x), m.ang)));
    m.x += Math.cos(m.ang) * 620 * dt; m.y += Math.sin(m.ang) * 620 * dt;
    for (const c of cars) if (!c.dead && c !== m.owner && Math.hypot(c.x - m.x, c.y - m.y) < 28) { m.life = 0; damage(c, 30); c.spin = Math.max(c.spin, 1); pop(m.x, m.y, '#ff8c5c', 14); break; }
  }
  missiles = missiles.filter((m) => m.life > 0);
  fx.forEach((f) => { f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt; }); fx = fx.filter((f) => f.life > 0);
  // last place is eliminated on a timer
  if (state === 'race') {
    elimT -= dt;
    if (elimT <= 0) {
      elimT = ELIM_EVERY;
      const alive = cars.filter((c) => !c.dead);
      if (alive.length > 1) eliminate(alive.reduce((lo, c) => (c.prog < lo.prog ? c : lo)), 'ELIMINATED');
    }
  }
  const order = cars.filter((c) => !c.dead).sort((a, b) => b.prog - a.prog);
  player.pos = player.dead ? player.place : order.indexOf(player) + 1;
}

// ---------------------------------------------------------------- render
function drawCar(c) {
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.ang);
  if (c.boostT > 0) { ctx.fillStyle = '#ffb000'; ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(-44 - Math.random() * 12, 0); ctx.lineTo(-20, 6); ctx.fill(); }
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-18, -11, 40, 26);
  ctx.fillStyle = c.col; ctx.fillRect(-20, -10, 40, 20);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(-6, -8, 16, 16);
  ctx.fillStyle = '#cfefff'; ctx.fillRect(8, -7, 5, 14);
  ctx.fillStyle = '#ffe9a8'; ctx.fillRect(18, -9, 3, 5); ctx.fillRect(18, 4, 3, 5);
  ctx.fillStyle = '#ff2255'; ctx.fillRect(-21, -9, 2, 5); ctx.fillRect(-21, 4, 2, 5);
  if (c.shield > 0) { ctx.strokeStyle = '#5bc8ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 28, 0, 7); ctx.stroke(); }
  ctx.restore();
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#07070f'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!player || !PATH) return;
  const f = player.dead ? cars.find((c) => !c.dead) || player : player;
  camAng += angDiff(f.ang, camAng) * 0.12; camX += (f.x - camX) * 0.25; camY += (f.y - camY) * 0.25;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(viewW / 2, viewH * 0.68); ctx.scale(zoom, zoom); ctx.rotate(-camAng - Math.PI / 2); ctx.translate(-camX, -camY);
  const R = Math.max(viewW, viewH) / zoom * 0.8;
  ctx.strokeStyle = 'rgba(0,229,255,.10)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let gx = Math.floor((camX - R) / 220) * 220; gx < camX + R; gx += 220) { ctx.moveTo(gx, camY - R); ctx.lineTo(gx, camY + R); }
  for (let gy = Math.floor((camY - R) / 220) * 220; gy < camY + R; gy += 220) { ctx.moveTo(camX - R, gy); ctx.lineTo(camX + R, gy); }
  ctx.stroke();
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,43,214,.35)'; ctx.lineWidth = ROAD + 34; ctx.stroke(PATH);
  ctx.strokeStyle = '#ff2bd6'; ctx.lineWidth = ROAD + 10; ctx.stroke(PATH);
  ctx.strokeStyle = '#141631'; ctx.lineWidth = ROAD - 4; ctx.stroke(PATH);
  ctx.strokeStyle = 'rgba(0,229,255,.35)'; ctx.lineWidth = 4; ctx.setLineDash([40, 40]); ctx.stroke(PATH); ctx.setLineDash([]);
  const s = PT[10], n = NRM[10];
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 12; ctx.setLineDash([12, 12]); ctx.beginPath(); ctx.moveTo(s.x - n.x * ROAD / 2, s.y - n.y * ROAD / 2); ctx.lineTo(s.x + n.x * ROAD / 2, s.y + n.y * ROAD / 2); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = '800 26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of pups) {
    if (!p.on || Math.abs(p.x - camX) > R || Math.abs(p.y - camY) > R) continue;
    ctx.fillStyle = PU[p.kind][1]; ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(camAng + Math.PI / 2); ctx.fillText(PU[p.kind][0], 0, 0); ctx.restore();
  }
  for (const c of cars) if (!c.dead && Math.abs(c.x - camX) < R && Math.abs(c.y - camY) < R) drawCar(c);
  ctx.fillStyle = '#ff8c5c'; for (const m of missiles) ctx.fillRect(m.x - 6, m.y - 6, 12, 12);
  for (const p of fx) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
}
function hud() {
  if (!player) return;
  $('hpFill').style.width = Math.max(0, player.hp / player.max * 100) + '%';
  $('boostFill').style.width = player.boostMeter + '%';
  $('spd').textContent = Math.max(0, Math.round(player.speed / SPEED * 2.6)) + ' km/h';
  $('pos').textContent = 'P' + (player.pos || 1) + '/' + GRID;
  $('alive').textContent = cars.filter((c) => !c.dead).length + ' · ' + Math.max(0, Math.ceil(elimT)) + 's';
  $('fireSm').textContent = player.item && player.item !== 'boost' && player.item !== 'shield' ? player.item : 'no item';
  $('fireBtn').style.borderColor = player.item === 'missile' ? '#fff' : '';
}

// ---------------------------------------------------------------- input
const keyMap = { arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', arrowdown: 'brake', s: 'brake', ' ': 'boost', shift: 'boost', e: 'fire', control: 'fire', f: 'fire' };
addEventListener('keydown', (e) => { const a = keyMap[e.key.toLowerCase()]; if (a) { e.preventDefault(); keys[a] = 1; } if (e.key === 'Escape') togglePause(); });
addEventListener('keyup', (e) => { const a = keyMap[e.key.toLowerCase()]; if (a && a !== 'fire') keys[a] = 0; });
document.querySelectorAll('.btn[data-act]').forEach((b) => {
  const a = b.dataset.act;
  const down = (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add('on'); keys[a] = 1; };
  const up = () => { b.classList.remove('on'); if (a !== 'fire') keys[a] = 0; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
});
addEventListener('contextmenu', (e) => e.preventDefault());

// ---------------------------------------------------------------- menus
function overlay(html) { const o = $('overlay'); o.innerHTML = html; o.classList.add('show'); o.scrollTop = 0; }
function closeOverlay() { $('overlay').classList.remove('show'); }
function pips(v, max) { const n = Math.max(1, Math.round(v / max * 5)); return '■'.repeat(n) + '□'.repeat(5 - n); }
function showHome() {
  state = 'home';
  overlay(`<div class="logo"><b>CYBER</b> <span>TRACK</span></div><div class="sub">LAST CAR STANDING · LITE</div>
    <div class="sub">Wins: ${wins}</div>
    <button class="big" id="hRace">▶ RACE</button><button class="big alt" id="hGarage">Garage &amp; Track</button>
    <div class="sub" style="margin-top:12px">Last place is eliminated every ${ELIM_EVERY}s · wreck rivals with missiles<br>${touch ? 'Auto-throttle · use the buttons under the track' : 'A/D steer · S brake · Space boost · E fire'}</div>`);
  $('hRace').onclick = startRace; $('hGarage').onclick = showGarage;
}
function showGarage() {
  state = 'garage';
  overlay(`<h2>GARAGE</h2><div class="sub">Wins: ${wins}</div><div class="row">${VEHICLES.map((v) => {
    const lock = v.wins > wins;
    return `<div class="card ${v.id === pick ? 'sel' : ''} ${lock ? 'locked' : ''}" data-v="${v.id}"><div class="nm">${v.name}</div><div class="mk">${v.make}</div>
      <div>SPD <span class="pips">${pips(v.top, 110)}</span></div><div>ACC <span class="pips">${pips(v.accel, 70)}</span></div><div>HND <span class="pips">${pips(v.hand, 3.4)}</span></div><div>HP <b>${v.hp}</b></div>
      <div>${lock ? '🔒 ' + v.wins + ' wins' : '✔ unlocked'}</div></div>`; }).join('')}</div>
    <h2>PAINT</h2><div class="row">${PAINTS.map((c) => `<div class="sw ${c === paint ? 'sel' : ''}" data-p="${c}" style="background:${c}"></div>`).join('')}</div>
    <h2>TRACK</h2><div class="row">${TRACKS.map((t, i) => `<div class="chip ${i === trackId ? 'sel' : ''}" data-t="${i}">${t}</div>`).join('')}</div>
    <button class="big" id="gRace">▶ RACE</button><button class="big alt" id="gBack">Back</button>`);
  document.querySelectorAll('[data-v]').forEach((el) => el.onclick = () => { const v = VEHICLES.find((x) => x.id === el.dataset.v); if (v.wins <= wins) { pick = v.id; save('ctl_vehicle', pick); showGarage(); } });
  document.querySelectorAll('[data-p]').forEach((el) => el.onclick = () => { paint = el.dataset.p; save('ctl_paint', paint); showGarage(); });
  document.querySelectorAll('[data-t]').forEach((el) => el.onclick = () => { trackId = +el.dataset.t; save('ctl_track', trackId); showGarage(); });
  $('gRace').onclick = startRace; $('gBack').onclick = showHome;
}
function togglePause() {
  if (state !== 'race' && !paused) return;
  paused = !paused;
  if (paused) { overlay('<h2>PAUSED</h2><button class="big" id="pR">Resume</button><button class="big alt" id="pQ">Quit</button>'); $('pR').onclick = togglePause; $('pQ').onclick = () => { paused = false; state = 'home'; showHome(); }; }
  else closeOverlay();
}

// ---------------------------------------------------------------- loop
function fit() {
  const hudH = $('hud').offsetHeight, padH = document.body.classList.contains('touch') ? 136 : 0;
  const w = Math.min(innerWidth - 8, 900), h = Math.max(160, Math.min(innerHeight - hudH - padH - 6, w * 1.15));
  dpr = Math.min(1.5, window.devicePixelRatio || 1);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  viewW = w; viewH = h; zoom = Math.min(w, h) / 620;
}
addEventListener('resize', fit);
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (player && !paused && state !== 'home' && state !== 'garage') {
    if (state === 'countdown') {
      countdown -= dt; const n = Math.ceil(countdown);
      $('banner').textContent = countdown > 0 ? String(n) : 'GO!';
      cars.forEach((c) => { if (c.isBot || true) { c.ang = TAN[c.idx]; } });
      if (countdown <= -0.5) { state = 'race'; $('banner').textContent = ''; }
      else if (countdown <= 0) { state = 'race'; setTimeout(() => { if (!banner) $('banner').textContent = ''; }, 700); }
    } else update(dt);
    hud();
  }
  render();
  requestAnimationFrame(loop);
}
fit(); buildTrack(trackId);
player = makeCar(VEHICLES[0], paint, 'YOU', false, 5); cars = [player]; locate(player);
showHome();
requestAnimationFrame(loop);
</script>
