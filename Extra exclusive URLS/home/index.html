<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Start</title>
  <style>
:root {
  --cursor-default: url("../../img/cursors/default.svg") 2 2, default;
  --cursor-pointer: url("../../img/cursors/pointer.svg") 12 3, pointer;
  --cursor-grab: url("../../img/cursors/grab.svg") 16 16, grab;
  --cursor-grabbing: url("../../img/cursors/grabbing.svg") 16 16, grabbing;
  --cursor-text: url("../../img/cursors/text.svg") 16 16, text;
  --cursor-vertical-text: url("../../img/cursors/vertical-text.svg") 16 16, vertical-text;
  --cursor-crosshair: url("../../img/cursors/crosshair.svg") 16 16, crosshair;
  --cursor-cell: url("../../img/cursors/cell.svg") 16 16, cell;
  --cursor-wait: url("../../img/cursors/wait.svg") 16 16, wait;
  --cursor-progress: url("../../img/cursors/progress.svg") 2 2, progress;
  --cursor-help: url("../../img/cursors/help.svg") 2 2, help;
  --cursor-not-allowed: url("../../img/cursors/not-allowed.svg") 16 16, not-allowed;
  --cursor-no-drop: url("../../img/cursors/no-drop.svg") 2 2, no-drop;
  --cursor-move: url("../../img/cursors/move.svg") 16 16, move;
  --cursor-all-scroll: url("../../img/cursors/all-scroll.svg") 16 16, all-scroll;
  --cursor-copy: url("../../img/cursors/copy.svg") 2 2, copy;
  --cursor-alias: url("../../img/cursors/alias.svg") 2 2, alias;
  --cursor-context-menu: url("../../img/cursors/context-menu.svg") 2 2, context-menu;
  --cursor-zoom-in: url("../../img/cursors/zoom-in.svg") 13 13, zoom-in;
  --cursor-zoom-out: url("../../img/cursors/zoom-out.svg") 13 13, zoom-out;
  --cursor-ew-resize: url("../../img/cursors/ew-resize.svg") 16 16, ew-resize;
  --cursor-ns-resize: url("../../img/cursors/ns-resize.svg") 16 16, ns-resize;
  --cursor-nwse-resize: url("../../img/cursors/nwse-resize.svg") 16 16, nwse-resize;
  --cursor-nesw-resize: url("../../img/cursors/nesw-resize.svg") 16 16, nesw-resize;
  --cursor-col-resize: url("../../img/cursors/col-resize.svg") 16 16, col-resize;
  --cursor-row-resize: url("../../img/cursors/row-resize.svg") 16 16, row-resize;
  --cursor-e-resize: var(--cursor-ew-resize);
  --cursor-w-resize: var(--cursor-ew-resize);
  --cursor-n-resize: var(--cursor-ns-resize);
  --cursor-s-resize: var(--cursor-ns-resize);
  --cursor-ne-resize: var(--cursor-nesw-resize);
  --cursor-sw-resize: var(--cursor-nesw-resize);
  --cursor-nw-resize: var(--cursor-nwse-resize);
  --cursor-se-resize: var(--cursor-nwse-resize);
}

    :root {
      --accent: #7c5cff;
      --bg: #14151b;
      --bg-elevated: #1e1f26;
      --card: #26272f;
      --border: #34353f;
      --text: #e8e8ee;
      --text-dim: #9a9aa5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(124,92,255,0.18), transparent 45%),
        radial-gradient(circle at 85% 10%, rgba(124,92,255,0.10), transparent 40%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8vh 20px 60px;
    }

    #clock { font-size: 13px; color: var(--text-dim); letter-spacing: 0.04em; margin-bottom: 6px; }
    h1 {
      font-weight: 700;
      font-size: 30px;
      margin: 0;
      background: linear-gradient(135deg, #7c5cff, #5eead4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #tagline {
      font-size: 13px;
      color: var(--text-dim);
      margin: 6px 0 28px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.15s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    #searchIcon { display: inline-block; animation: floatIcon 2.4s ease-in-out infinite; }

    #searchForm {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 6px 4px 16px;
      overflow: hidden;
      height: 52px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #searchForm:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,0.18); }
    #searchIcon { opacity: 0.6; display: flex; align-items: center; flex-shrink: 0; margin-right: 6px; }
    #searchInput {
      flex: 1;
      min-width: 0;
      width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
    }
    #searchInput::placeholder { color: var(--text-dim); }
    #searchGo {
      background: var(--accent);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: var(--cursor-pointer);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }
    #searchGo:hover { filter: brightness(1.08); }
    #searchGo { background: linear-gradient(135deg, #7c5cff, #4f8cff); }
    .searchTool {
      background: transparent;
      border: none;
      color: var(--text-dim);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: var(--cursor-pointer);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }
    .searchTool.on, .searchTool.on:hover { background: linear-gradient(135deg, var(--accent), #8b5cf6); color: white; }
    .searchTool:hover { background: var(--card); color: var(--text); }
    .hidden { display: none !important; }


    .empty { color: var(--text-dim); font-size: 12px; }

    .bookmark-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 28px;
      max-width: 700px;
    }
    .bm-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 64px;
      text-decoration: none;
      color: inherit;
      cursor: var(--cursor-pointer);
    }
    .bm-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: inherit;
    }
    .bm-tile .favicon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: border-color 0.12s, transform 0.12s;
    }
    .bm-tile:hover .favicon-wrap { border-color: var(--accent); transform: translateY(-2px); }
    .bm-tile .favicon-wrap img { width: 24px; height: 24px; object-fit: contain; border-radius: 8px; }
    .bm-tile .bm-name {
      font-size: 11px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 64px;
    }
    .bm-tile { position: relative; }
    .bm-menu-btn {
      position: absolute;
      top: -6px;
      right: -2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      line-height: 1;
      cursor: var(--cursor-pointer);
      opacity: 0;
      transition: opacity 0.12s;
    }
    .bm-tile:hover .bm-menu-btn { opacity: 1; }
    .bm-menu-btn:hover { color: var(--text); border-color: var(--accent); }

    .folder-icon { font-size: 22px; }

    .bm-popover {
      position: absolute;
      z-index: 50;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      min-width: 160px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .bm-popover button {
      all: unset;
      box-sizing: border-box;
      width: 100%;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 12px;
      cursor: var(--cursor-pointer);
      color: var(--text);
    }
    .bm-popover button:hover { background: var(--card); }
    .bm-popover input {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 6px 8px;
      font-size: 12px;
      outline: none;
      margin-top: 4px;
    }

    .folder-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      width: 100%;
      max-width: 700px;
    }
    .folder-back {
      all: unset;
      cursor: var(--cursor-pointer);
      color: var(--text-dim);
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 10px;
    }
    .folder-back:hover { background: var(--card); color: var(--text); }
    .folder-header .folder-title { font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="clock"></div>
  <h1>Kithe</h1>
  <div id="tagline"></div>

  <form id="searchForm">
    <span id="searchIcon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
    <input id="searchInput" type="text" placeholder="Search or type an address" autofocus spellcheck="false" />
    <button id="voiceBtn" class="searchTool hidden" type="button" title="Search with voice"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="aiBtn" class="searchTool" type="button" title="Search with AI Mode"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.9 5.6L18.5 10.5l-5.6 1.9L11 18l-1.9-5.6L3.5 10.5l5.6-1.9z"/><path d="M19 14.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg></button>
    <button id="searchGo" type="submit" title="Search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>

  <div class="bookmark-row" id="appsRow"></div>

  <div class="folder-header" id="folderHeader" style="display:none">
    <button class="folder-back" id="folderBack">← Back</button>
    <span class="folder-title" id="folderTitle"></span>
  </div>
  <div class="bookmark-row" id="bookmarkRow"></div>

  <script>
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function tick() {
      const el = document.getElementById('clock');
      el.textContent = new Date().toLocaleString(undefined, {
        weekday: 'long', hour: 'numeric', minute: '2-digit',
      });
    }
    tick();
    setInterval(tick, 30000);

    const TAGLINES = [
      'Where to today?',
      'Dive in — the water\'s fine.',
      'Type a URL, or just wing it.',
      'Your web, your rules.',
      'Explore the depths.',
      'Ready when you are.',
    ];
    function timeGreeting() {
      const h = new Date().getHours();
      if (h < 5) return 'Still up?';
      if (h < 12) return 'Good morning';
      if (h < 18) return 'Good afternoon';
      return 'Good evening';
    }
    document.getElementById('tagline').textContent =
      `${timeGreeting()} — ${TAGLINES[Math.floor(Math.random() * TAGLINES.length)]}`;

    if (window.__voiceSearch) document.getElementById('voiceBtn').classList.remove('hidden');
    document.getElementById('voiceBtn').addEventListener('click', () => { window.location.href = 'kithe-voice:search'; });
    const aiBtn = document.getElementById('aiBtn');
    window.__setAiOn = (on) => { window.__aiOn = !!on; aiBtn.classList.toggle('on', !!on); };
    window.__setAiOn(window.__aiOn);
    aiBtn.addEventListener('click', () => { window.location.href = 'kithe-aimode:toggle'; });
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('searchInput').value.trim();
      if (q) window.location.href = (window.__aiOn ? 'kithe-ai:' : 'kithe-search:') + encodeURIComponent(q);
    });

    // --- Exclusive apps row (under the search bar) ---
    const exclusiveApps = window.__exclusiveApps || [];
    const appsRow = document.getElementById('appsRow');
    for (const app of exclusiveApps) {
      const wrap = document.createElement('div');
      wrap.className = 'bm-tile';
      const iconHtml = app.iconImage
        ? `<img src="${escapeHtml(app.iconImage)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${app.icon || '🌐'}'}))" />`
        : (app.icon || '🌐');
      wrap.innerHTML = `
        <a class="bm-link" href="http://${escapeHtml(app.hostname)}/">
          <span class="favicon-wrap">${iconHtml}</span>
          <span class="bm-name">${escapeHtml(app.title)}</span>
        </a>
      `;
      appsRow.appendChild(wrap);
    }

    // --- Bookmarks row (under the search bar), with folders ---
    const bookmarks = window.__bookmarks || [];
    const bookmarkRow = document.getElementById('bookmarkRow');
    const folderHeader = document.getElementById('folderHeader');
    const folderTitle = document.getElementById('folderTitle');
    const folderBack = document.getElementById('folderBack');
    let openFolder = null; // folder name currently expanded, or null for the top-level view
    let openPopoverEl = null;

    function toBase64Url(str) {
      return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function sendBookmarkAction(id, payload) {
      window.location.href = 'kithe-bookmark-action:' + toBase64Url(JSON.stringify({ id, ...payload }));
    }
    function faviconHtml(b) {
      return b.faviconUrl
        ? `<img src="${escapeHtml(b.faviconUrl)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🌐'}))" />`
        : '🌐';
    }
    function closePopover() {
      if (openPopoverEl) { openPopoverEl.remove(); openPopoverEl = null; }
    }
    document.addEventListener('click', closePopover);

    function openBookmarkMenu(btn, b, folderNames) {
      closePopover();
      const pop = document.createElement('div');
      pop.className = 'bm-popover';
      const rect = btn.getBoundingClientRect();
      pop.style.top = (rect.bottom + window.scrollY + 4) + 'px';
      pop.style.left = (rect.left + window.scrollX - 130) + 'px';

      const buttons = [`<button id="bmRenameBtn">✎ Rename…</button>`];
      for (const name of folderNames) {
        if (name === b.folder) continue;
        buttons.push(`<button data-folder="${escapeHtml(name)}">📁 Move to "${escapeHtml(name)}"</button>`);
      }
      buttons.push(`<button id="bmNewFolderBtn">＋ New folder…</button>`);
      if (b.folder) buttons.push(`<button data-folder="">Remove from folder</button>`);
      pop.innerHTML = buttons.join('');

      pop.querySelectorAll('button[data-folder]').forEach((btnEl) => {
        btnEl.addEventListener('click', (e) => { e.stopPropagation(); sendBookmarkAction(b.id, { folder: btnEl.dataset.folder || null }); });
      });
      const newFolderBtn = pop.querySelector('#bmNewFolderBtn');
      newFolderBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        newFolderBtn.outerHTML = '<input id="bmNewFolderInput" type="text" placeholder="Folder name" spellcheck="false" />';
        const input = pop.querySelector('#bmNewFolderInput');
        input.focus();
        input.addEventListener('click', (ev) => ev.stopPropagation());
        input.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' && input.value.trim()) sendBookmarkAction(b.id, { folder: input.value.trim() });
        });
      });
      const renameBtn = pop.querySelector('#bmRenameBtn');
      renameBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        renameBtn.outerHTML = `<input id="bmRenameInput" type="text" value="${escapeHtml(b.title)}" spellcheck="false" />`;
        const input = pop.querySelector('#bmRenameInput');
        input.focus();
        input.select();
        input.addEventListener('click', (ev) => ev.stopPropagation());
        input.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' && ev.target.value.trim()) sendBookmarkAction(b.id, { title: ev.target.value.trim() });
        });
      });

      document.body.appendChild(pop);
      openPopoverEl = pop;
    }

    function toggleFolder(name) {
      openFolder = openFolder === name ? null : name;
      renderBookmarks();
    }

    function renderBookmarks() {
      bookmarkRow.innerHTML = '';
      closePopover();

      if (bookmarks.length === 0) {
        folderHeader.style.display = 'none';
        bookmarkRow.innerHTML = '<div class="empty">Bookmark a page (☆ in the address bar) to see it here</div>';
        return;
      }

      const folderNames = [...new Set(bookmarks.filter((b) => b.folder).map((b) => b.folder))];

      if (openFolder) {
        folderHeader.style.display = 'flex';
        folderTitle.textContent = `📁 ${openFolder}`;
        const items = bookmarks.filter((b) => b.folder === openFolder);
        for (const b of items) bookmarkRow.appendChild(renderItem(b, folderNames));
        return;
      }

      folderHeader.style.display = 'none';
      const loose = bookmarks.filter((b) => !b.folder);
      for (const b of loose) bookmarkRow.appendChild(renderItem(b, folderNames));

      for (const name of folderNames) {
        const items = bookmarks.filter((b) => b.folder === name);
        const wrap = document.createElement('div');
        wrap.className = 'bm-tile';
        wrap.innerHTML = `
          <div class="favicon-wrap folder-icon">📁</div>
          <span class="bm-name">${escapeHtml(name)} (${items.length})</span>
        `;
        wrap.style.cursor = 'pointer';
        wrap.addEventListener('click', () => toggleFolder(name));
        bookmarkRow.appendChild(wrap);
      }
    }

    function renderItem(b, folderNames) {
      const wrap = document.createElement('div');
      wrap.className = 'bm-tile';
      wrap.innerHTML = `
        <a class="bm-link" href="${escapeHtml(b.url)}">
          <span class="favicon-wrap">${faviconHtml(b)}</span>
          <span class="bm-name">${escapeHtml(b.title)}</span>
        </a>
        <button class="bm-menu-btn" title="Organize">⋯</button>
      `;
      wrap.querySelector('.bm-menu-btn').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        openBookmarkMenu(e.currentTarget, b, folderNames);
      });
      return wrap;
    }

    folderBack.addEventListener('click', () => { openFolder = null; renderBookmarks(); });
    renderBookmarks();
  </script>
</body>
</html>
