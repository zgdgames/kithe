<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" type="image/png" href="../Favicon.png" />
<title>1v1 Fighting</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #14151b; color: #e8e8ee; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #hud { width: 100%; display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px 4px; }
  .side { flex: 1; min-width: 0; }
  .side.right { text-align: right; }
  .name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .bar { height: 12px; background: #26272f; border: 1px solid #34353f; border-radius: 6px; overflow: hidden; position: relative; }
  .bar.thin { height: 6px; margin-top: 3px; border-radius: 3px; }
  .fill { height: 100%; width: 100%; transition: width .08s linear; }
  .side.right .fill { margin-left: auto; }
  .hp .fill { background: linear-gradient(90deg, #3ddc84, #b6e83d); }
  .en .fill { background: linear-gradient(90deg, #5b8cff, #a45bff); }
  .st .fill { background: #9a9aa5; }
  #timer { width: 46px; text-align: center; font-size: 22px; font-weight: 800; padding-top: 6px; flex: none; }
  #stage { position: relative; flex: none; }
  canvas#c { display: block; background: #87c3f0; border-radius: 8px; }
  #pad { display: none; width: 100%; flex: none; height: 150px; margin-top: 6px; padding: 8px 10px 12px; justify-content: space-between; align-items: center; gap: 8px; }
  body.touch #pad { display: flex; }
  .cluster { display: grid; gap: 8px; }
  #moves { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; }
  #moves .jump { grid-column: 2; grid-row: 1; }
  #moves .left { grid-column: 1; grid-row: 2; }
  #moves .right { grid-column: 3; grid-row: 2; }
  #moves { width: min(46vw, 210px); height: min(100%, 150px); }
  #acts { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: min(46vw, 210px); height: min(100%, 150px); }
  .btn { background: #26272f; border: 2px solid #34353f; border-radius: 16px; color: #e8e8ee; font-size: 14px; font-weight: 700; display: flex;
    align-items: center; justify-content: center; text-align: center; touch-action: none; position: relative; overflow: hidden; }
  .btn.on { background: #7c5cff; border-color: #a45bff; }
  .btn.punch { border-color: #ff8c5c; } .btn.kick { border-color: #ffc94d; } .btn.block { border-color: #5bc8ff; }
  .btn.ability { border-color: #a45bff; flex-direction: column; line-height: 1.1; padding: 2px; }
  .btn.ability small { font-size: 10px; opacity: .85; font-weight: 600; }
  .btn.ability span { font-size: 12px; }
  .btn.ability .meter { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: rgba(124,92,255,.45); }
  .btn.ability.ready { background: #7c5cff; animation: pulse .7s infinite alternate; }
  .btn span { position: relative; }
  @keyframes pulse { to { box-shadow: 0 0 14px #a45bff; } }
  #pause { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border-radius: 10px; background: rgba(20,21,27,.6); color: #fff; border: 1px solid #34353f; font-size: 15px; }
  #overlay { position: fixed; inset: 0; background: rgba(20,21,27,.94); display: none; flex-direction: column; align-items: center; overflow-y: auto; padding: 18px 12px 28px; z-index: 20; touch-action: pan-y; }
  #overlay.show { display: flex; }
  h1 { margin: 6px 0 4px; font-size: 28px; }
  h2 { margin: 4px 0 8px; font-size: 20px; }
  .sub { color: #9a9aa5; font-size: 13px; margin-bottom: 14px; text-align: center; }
  .coins { color: gold; font-weight: 700; margin-bottom: 10px; }
  .big { background: linear-gradient(135deg, #5b8cff, #a45bff); border: none; color: #fff; font-weight: 800; font-size: 16px; padding: 12px 26px; border-radius: 12px; margin: 6px; min-width: 180px; }
  .lvl { width: min(320px, 90%); margin-bottom: 8px; text-align: center; }
  .lvl input { width: 100%; accent-color: #7c5cff; height: 32px; touch-action: pan-x; }
  .lvlab { display: flex; justify-content: space-between; font-size: 11px; color: #9a9aa5; }
  .big.alt { background: #26272f; border: 1px solid #34353f; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: 100%; max-width: 760px; }
  .card { background: #1e1f26; border: 2px solid #34353f; border-radius: 12px; padding: 8px; text-align: center; position: relative; touch-action: pan-y; }
  .card.picked { border-color: #7c5cff; }
  .card canvas { width: 80px; height: 96px; }
  .card .nm { font-weight: 700; font-size: 13px; }
  .card .tier { position: absolute; top: 6px; left: 8px; font-size: 11px; font-weight: 800; color: #9a9aa5; }
  .card .stat { font-size: 11px; color: #9a9aa5; text-align: left; margin-top: 2px; }
  .card .stat b { color: #e8e8ee; font-weight: 600; }
  .card .ab { font-size: 11px; color: #c9b6ff; margin-top: 4px; text-align: left; }
  .card .buy { margin-top: 6px; width: 100%; padding: 6px; border-radius: 8px; border: none; font-weight: 700; background: #ffc94d; color: #222; }
  .card .buy:disabled { background: #34353f; color: #777; }
  .card .own { margin-top: 6px; font-size: 12px; color: #3ddc84; font-weight: 700; }
  #banner { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: 44px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #000; pointer-events: none; }
  #toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: #26272f; border: 1px solid #34353f; border-radius: 999px; padding: 6px 16px; font-size: 13px; opacity: 0; transition: opacity .2s; z-index: 30; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="side" id="hudP"><div class="name" id="nameP">YOU</div><div class="bar hp"><div class="fill" id="hpP"></div></div><div class="bar thin en"><div class="fill" id="enP"></div></div><div class="bar thin st"><div class="fill" id="stP"></div></div></div>
    <div id="timer">60</div>
    <div class="side right" id="hudB"><div class="name" id="nameB">BOT</div><div class="bar hp"><div class="fill" id="hpB"></div></div><div class="bar thin en"><div class="fill" id="enB"></div></div><div class="bar thin st"><div class="fill" id="stB"></div></div></div>
  </div>
  <div id="stage">
    <canvas id="c" width="720" height="405"></canvas>
    <div id="banner"></div>
    <button id="pause">&#10074;&#10074;</button>
  </div>
  <div id="pad">
    <div class="cluster" id="moves">
      <div class="btn jump" data-act="jump">&#9650;</div>
      <div class="btn left" data-act="left">&#9664;</div>
      <div class="btn right" data-act="right">&#9654;</div>
    </div>
    <div class="cluster" id="acts">
      <div class="btn punch" data-act="punch"><span>Punch</span></div>
      <div class="btn kick" data-act="kick"><span>Kick</span></div>
      <div class="btn block" data-act="block"><span>Block</span></div>
      <div class="btn ability" data-act="ability" id="abBtn"><div class="meter" id="abMeter"></div><span id="abLabel"></span></div>
    </div>
  </div>
</div>
<div id="overlay"></div>
<div id="toast"></div>
<script src="../shared/constants.js"></script>
<script>
'use strict';
// ------------------------------------------------------------------ setup
const SK = window.CHARACTER_CLASSES;
const PRICES = window.SKIN_PRICES;
let W = 720, LEFT = 30, RIGHT = 690;
let H = 405, GROUND = 345, viewScale = 1, camZ = 1;
const $ = (id) => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || /pad=1/.test(location.search);
if (touch) document.body.classList.add('touch');

// ------------------------------------------------------------ persistence
function load(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
let coins = load('kf_coins', 0);
let owned = load('kf_owned', ['balanced']);
if (!owned.includes('balanced')) owned.push('balanced');
let chosen = load('kf_skin', 'balanced');
let level = Math.max(1, Math.min(10, load('kf_level', 5)));
const coinsFor = (lv) => 6 * lv;
if (!owned.includes(chosen)) chosen = 'balanced';

// ---------------------------------------------------------------- fighters
const ms = (n) => Math.round(n * 0.06); // milliseconds -> 60fps frames
function makeFighter(id, x, face, isBot) {
  const c = SK[id];
  return { id, c, isBot, x, y: 0, vy: 0, vx: 0, face, hp: c.health, max: c.health, en: 0, st: 100, stLock: 0,
    act: 'idle', t: 0, cd: 0, stun: 0, inv: 0, combo: 0, comboT: 0, blocking: false, walk: 0, dead: false,
    dmgMul: 1, dmgT: 0, spdMul: 1, spdT: 0, reflT: 0, red: 0, redT: 0, shield: 0, shieldT: 0, slowT: 0, abCd: 0, auraT: 0,
    inp: { left: 0, right: 0, jump: 0, punch: 0, kick: 0, block: 0, ability: 0 } };
}
let P, B, fx = [], shake = 0, frame = 0, roundTime = 60, state = 'menu', paused = false, countdown = 0, botBrain;

function addText(x, y, txt, col) { fx.push({ k: 'text', x, y, txt, col: col || '#fff', life: 45 }); }
function addSpark(x, y, col) { for (let i = 0; i < 6; i++) fx.push({ k: 'spark', x, y, vx: (Math.random() - .5) * 6, vy: (Math.random() - .8) * 5, col, life: 18 }); }
function addBeam(x1, y1, x2, y2, col) { fx.push({ k: 'beam', x1, y1, x2, y2, col, life: 14 }); }
function addRing(x, y, col) { fx.push({ k: 'ring', x, y, col, life: 20 }); }

// Central damage routine: handles invulnerability, Ice Shield, blocking,
// damage reduction, Counter Stance reflection, stun and knockback.
function hurt(t, src, dmg, o) {
  o = o || {};
  if (t.dead) return false;
  if (src.isBot) dmg *= 0.75 + 0.025 * level;
  const cx = t.x, cy = GROUND - 60 - t.y;
  if (t.inv > 0) { addText(cx, cy, 'DODGE', '#9be7ff'); return false; }
  if (t.shield > 0) { t.shield--; addText(cx, cy, 'SHIELDED', '#bfe9ff'); addRing(cx, cy, '#bfe9ff'); if (t.shield === 0) t.shieldT = 0; return false; }
  if (t.reflT > 0 && !o.pierce) {
    const r = Math.round(dmg * 1.5); src.hp -= r; addText(src.x, GROUND - 60 - src.y, 'REFLECT -' + r, '#c99bff'); addRing(cx, cy, '#c99bff');
    if (src.hp <= 0) kill(src);
    return false;
  }
  // Blocking stops all damage (abilities included) but drains stamina; an empty bar breaks the guard.
  if (t.blocking) {
    t.st -= Math.max(12, dmg * 1.5);
    addText(cx, cy, 'BLOCKED', '#bfe9ff'); addSpark(cx, cy, '#bfe9ff');
    if (t.st <= 0) { t.st = 0; t.stLock = 60; t.blocking = false; addText(cx, cy - 22, 'GUARD BREAK', '#ffb84d'); }
    t.en = Math.min(100, t.en + 4);
    t.vx += src.face * 1.5; shake = Math.max(shake, 2);
    return false;
  }
  if (t.redT > 0) dmg *= (1 - t.red);
  dmg = Math.max(1, Math.round(dmg));
  t.hp -= dmg;
  t.en = Math.min(100, t.en + 8);
  // damage numbers and hit sparks use the attacker's main colour
  const hue = src.c.colors.primary;
  addText(cx, cy, '-' + dmg, hue);
  addSpark(cx, cy, hue);
  t.stun = Math.max(t.stun, o.stun || 10); t.act = 'hit'; t.t = 0;
  t.vx += src.face * (o.kb !== undefined ? o.kb : 4);
  shake = Math.max(shake, 5);
  if (t.hp <= 0) kill(t);
  return true;
}
function kill(t) { t.hp = 0; t.dead = true; t.act = 'ko'; if (state === 'fight') endRound(t === P ? B : P); }

function landed(f) { f.en = Math.min(100, f.en + 15); f.combo = f.comboT > 0 ? f.combo + 1 : 1; f.comboT = ms(2000); }
function comboMul(f) { return f.comboT > 0 ? Math.min(2, 1 + 0.2 * f.combo) : 1; }

function strike(f, o, type) {
  const reach = (type === 'punch' ? 58 : 74) * f.c.size;
  const dx = (o.x - f.x) * f.face;
  if (dx < -8 || dx > reach + 16 || Math.abs(o.y - f.y) > 75) return;
  const base = type === 'punch' ? f.c.punchDamage : Math.max(f.c.kickDamage * 1.3, f.c.punchDamage * 1.6);
  const ok = hurt(o, f, base * comboMul(f) * f.dmgMul, { kb: type === 'kick' ? 6 : 3.5 });
  if (ok) landed(f);
}

// ----------------------------------------------------------------- abilities
function abilityBanner(f, txt) { addText(f.x, GROUND - 140 - f.y, txt, '#c9b6ff'); addRing(f.x, GROUND - 60 - f.y, '#c9b6ff'); f.auraT = 30; }
function useAbility(f, o) {
  if (f.en < 100 || f.abCd > 0 || f.dead || f.stun > 0) return false;
  const a = f.c.ability, dist = Math.abs(o.x - f.x);
  const strikeAt = (dmg, stun, kb, pierce) => { addBeam(f.x, GROUND - 70 - f.y, o.x, GROUND - 70 - o.y, f.c.colors.primary); hurt(o, f, dmg, { pierce: true, stun, kb }); };
  switch (f.id) {
    case 'balanced': f.reflT = ms(a.duration); break;
    case 'crimsonDemon': f.hp = Math.max(1, f.hp - a.healthCost); f.dmgMul = a.damageMultiplier; f.dmgT = ms(a.duration); break;
    case 'speedster': f.inv = ms(a.duration); f.vx = f.face * 30; break;
    case 'agileNinja': { const side = f.x < o.x ? 1 : -1; f.x = Math.max(LEFT, Math.min(RIGHT, o.x + side * 48)); f.inv = ms(a.duration); break; }
    case 'thunderMonk': if (dist > 420) return fizzle(f); strikeAt(a.damage, ms(a.stunDuration), 2); break;
    case 'shadowAssassin': if (dist > 220) return fizzle(f); strikeAt(a.damage, 20, 5); break;
    case 'flameStriker': if (dist > a.range + 40) return fizzle(f); strikeAt(a.damage, 14, 6); break;
    case 'sakuraWarrior': f.spdMul = a.speedMultiplier; f.spdT = ms(a.duration); break;
    case 'arcticFox': f.shield = a.immuneAttacks; f.shieldT = ms(a.duration); break;
    case 'iceKnight': o.slowT = ms(a.duration); addRing(o.x, GROUND - 60 - o.y, '#7fffd4'); break;
    case 'mysticWarrior': f.hp = Math.min(f.max, f.hp + a.healAmount); addText(f.x, GROUND - 160 - f.y, '+' + a.healAmount, '#3ddc84'); break;
    case 'brawler': f.dmgMul = a.damageMultiplier; f.dmgT = ms(a.duration); break;
    case 'heavyTanker': f.red = a.damageReduction; f.redT = ms(a.duration); break;
    case 'stoneGuardian': if (dist > 260 || o.y > 20) return fizzle(f); hurt(o, f, a.damage, { pierce: true, stun: 25, kb: 14 }); shake = 12; break;
    default: return false;
  }
  f.en = 0; f.abCd = ms(a.cooldown); abilityBanner(f, a.name.toUpperCase());
  return true;
}
function fizzle(f) { if (f === P) toast('Out of range!'); return false; }

// ------------------------------------------------------------------ update
function updateFighter(f, o) {
  ['dmgT', 'spdT', 'reflT', 'redT', 'shieldT', 'slowT', 'abCd', 'cd', 'comboT', 'inv', 'stLock', 'auraT'].forEach((k) => { if (f[k] > 0) f[k]--; });
  if (f.dmgT === 0) f.dmgMul = 1;
  if (f.spdT === 0) f.spdMul = 1;
  if (f.shieldT === 0) f.shield = 0;
  if (f.comboT === 0) f.combo = 0;
  const airborne = f.y > 0;
  if (f.dead) { f.vx *= 0.9; f.x += f.vx; applyPhysics(f); return; }
  if (f.stun > 0) { f.stun--; f.inp.ability = 0; if (f.stun === 0) f.act = 'idle'; }
  else {
    if (o.x !== f.x && !airborne) f.face = o.x > f.x ? 1 : -1;
    const attacking = f.act === 'punch' || f.act === 'kick';
    // block
    const wantBlock = f.inp.block && f.stLock === 0 && f.st > 0 && !airborne && !attacking;
    f.blocking = !!wantBlock;
    if (f.blocking) f.st = Math.max(0, f.st - 1.5); else f.st = Math.min(100, f.st + 0.8);
    if (f.st <= 0 && f.blocking) { f.blocking = false; f.stLock = 60; }
    // attacks
    if (!attacking && !f.blocking && f.cd === 0) {
      const spd = f.spdMul;
      if (f.inp.punch) { f.act = 'punch'; f.t = 0; f.cd = Math.round(ms(f.c.punchCooldown) * spd); }
      else if (f.inp.kick) { f.act = 'kick'; f.t = 0; f.cd = Math.round(ms(f.c.kickCooldown) * 1.25 * spd); }
    }
    if (f.act === 'punch') { f.t++; if (f.t === 5) strike(f, o, 'punch'); if (f.t >= 12) f.act = 'idle'; }
    else if (f.act === 'kick') { f.t++; if (f.t === 11) strike(f, o, 'kick'); if (f.t >= 21) f.act = 'idle'; }
    if (f.inp.ability) {
      if (!useAbility(f, o) && f === P) { if (f.abCd > 0) toast('Ability cooling down'); else if (f.en < 100) toast('Ability needs full energy (' + Math.floor(f.en) + '%)'); }
      f.inp.ability = 0;
    }
    // movement
    if (!f.blocking && f.act !== 'punch' && f.act !== 'kick') {
      const dir = f.inp.right - f.inp.left;
      const slow = f.slowT > 0 ? 0.5 : 1;
      f.x += dir * f.c.moveSpeed * slow;
      if (dir) { f.walk++; if (!airborne) f.act = 'walk'; } else if (!airborne && f.act === 'walk') f.act = 'idle';
      if (f.inp.jump && !airborne) { f.vy = f.c.jumpStrength * 0.62; }
    }
    if (!airborne && f.act === 'idle') f.walk = 0;
  }
  f.x += f.vx; f.vx *= 0.85;
  applyPhysics(f);
}
function applyPhysics(f) {
  f.y += f.vy; f.vy -= 0.55;
  if (f.y <= 0) { f.y = 0; f.vy = 0; }
  f.x = Math.max(LEFT, Math.min(RIGHT, f.x));
}
function separate() {
  if (P.y > 25 || B.y > 25) return;
  const gap = 30, d = B.x - P.x;
  if (Math.abs(d) < gap) { const push = (gap - Math.abs(d)) / 2, s = d >= 0 ? 1 : -1; P.x -= s * push; B.x += s * push; P.x = Math.max(LEFT, P.x); B.x = Math.min(RIGHT, B.x); }
}

// ------------------------------------------------------------------- bot AI
// Bot difficulty 1-10. Level 10 matches the old level-7 bot; each level scales its
// reaction speed, blocking, attack rate and whether it uses abilities.
function newBrain() { return { think: 0, move: 0, blockT: 0, jumpCd: 0, atkCd: 20 }; }
function botControl(f, o) {
  const br = botBrain, i = f.inp, L = 0.85 * level;
  i.left = i.right = i.punch = i.kick = i.jump = i.block = 0;
  if (f.dead || f.stun > 0) return;
  if (br.jumpCd > 0) br.jumpCd--;
  if (br.atkCd > 0) br.atkCd--;
  const dist = Math.abs(o.x - f.x), dir = o.x > f.x ? 1 : -1;
  const reach = 74 * f.c.size + 8;
  const oAttacking = o.act === 'punch' || o.act === 'kick';
  if (br.blockT > 0) { br.blockT--; i.block = 1; }
  else if (oAttacking && dist < 100 && Math.random() < 0.05 * Math.pow(L / 7, 2) && f.st > 30) br.blockT = 18 + Math.floor(Math.random() * 14);
  if (br.blockT > 0) return;
  if (--br.think <= 0) {
    br.think = Math.max(2, Math.round(8 + (7 - L) * 2.2 + Math.random() * 12 * ((11 - L) / 4)));
    if (dist > reach + 20) br.move = dir;
    else if (dist < 45) br.move = Math.random() < 0.6 ? -dir : 0;
    else br.move = Math.random() < 0.35 ? dir : Math.random() < 0.5 ? -dir : 0;
    if (f.hp < f.max * 0.3 && Math.random() < 0.4) br.move = -dir;
  }
  if (br.move > 0) i.right = 1; else if (br.move < 0) i.left = 1;
  if (dist < reach + 6 && br.atkCd === 0 && f.cd === 0) {
    if (Math.random() < Math.min(0.97, 0.8 * L / 7)) {
      if (Math.random() < 0.55) i.punch = 1; else i.kick = 1;
      br.atkCd = Math.round((14 + Math.floor(Math.random() * 22)) * Math.pow(7 / L, 0.8));
    }
  }
  if (f.y === 0 && br.jumpCd === 0 && Math.random() < 0.006) { i.jump = 1; br.jumpCd = 90; }
  if (level >= 3 && f.en >= 100 && f.abCd === 0 && Math.random() < L / 12) {
    const need = { thunderMonk: 400, flameStriker: 220, shadowAssassin: 200, stoneGuardian: 240 }[f.id];
    const heal = f.id === 'mysticWarrior' ? f.hp < f.max * 0.6 : true;
    const inRange = need ? dist < need : (dist < 220 || f.id === 'speedster' && dist > 100);
    if (heal && inRange) i.ability = 1;
  }
}

// ------------------------------------------------------------------- drawing
function limb(c, x, y, l1, l2, a1, a2) {
  const r1 = a1 * Math.PI / 180, r2 = (a1 + a2) * Math.PI / 180;
  const ex = x + Math.sin(r1) * l1, ey = y + Math.cos(r1) * l1;
  const hx = ex + Math.sin(r2) * l2, hy = ey + Math.cos(r2) * l2;
  c.beginPath(); c.moveTo(x, y); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
  return [hx, hy];

  if (st.belt) { c.strokeStyle = st.belt; c.lineWidth = 4; c.beginPath(); c.moveTo(-6, hip[1] - 4); c.quadraticCurveTo(0, hip[1] - 1, 6, hip[1] - 4); c.stroke(); c.fillStyle = '#fff'; c.beginPath(); c.arc(1, hip[1] - 2.5, 2.2, 0, 7); c.fill(); }
  if (st.bare) { c.strokeStyle = suit; c.lineWidth = 8; c.beginPath(); c.moveTo(-5, hip[1] + 1); c.quadraticCurveTo(0, hip[1] + 4, 5, hip[1] + 1); c.stroke(); }
  if (st.orb) { c.save(); c.translate(-20 + p.lean, -84 + Math.sin(frame / 10) * 5); const g = c.createRadialGradient(0, 0, 1, 0, 0, 12); g.addColorStop(0, '#fffbd0'); g.addColorStop(0.5, 'rgba(255,240,150,.55)'); g.addColorStop(1, 'rgba(255,240,150,0)'); c.fillStyle = g; c.beginPath(); c.arc(0, 0, 12, 0, 7); c.fill(); c.restore(); }

  // front arm + hand
  const elbow = limbJoint([sh[0], sh[1] + 4], 20, p.fa);
  const frontHand = armLine(p.fa, 6, col);
  if (st.armor || st.rocks) padAt(elbow, 3.8);
  if (st.flames) fireFist(c, frontHand, f.act, false);
  else fist(frontHand, !!st.gloves);
  if (st.dagger) { c.save(); c.translate(frontHand[0], frontHand[1]); c.rotate(1.15); c.fillStyle = '#e4e6f0'; c.beginPath(); c.moveTo(-2, 0); c.quadraticCurveTo(-2.4, -12, 0, -21); c.quadraticCurveTo(2.4, -12, 2, 0); c.closePath(); c.fill(); c.strokeStyle = dark; c.lineWidth = 1; c.stroke(); c.restore(); }

  // head + face
  const face = st.mask || st.hood ? shade(col, -0.3) : shade(col, 0.12);
  c.fillStyle = face; c.strokeStyle = dark; c.lineWidth = 2.4; c.beginPath(); c.arc(hd[0], hd[1], 12, 0, 7); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.ellipse(hd[0] - 3, hd[1] - 5, 5.5, 3, -0.5, 0, 7); c.fill();
  const ey = st.eye;
  c.fillStyle = ey || '#fff'; c.beginPath(); c.ellipse(hd[0] + 5, hd[1] - 2, 3.2, ey ? 2.2 : 3.3, 0, 0, 7); c.fill();
  if (!ey) { c.fillStyle = '#111'; c.beginPath(); c.arc(hd[0] + 6.2, hd[1] - 2, 1.6, 0, 7); c.fill(); }
  if (st.brow || st.hood) { c.strokeStyle = '#111'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(hd[0] + 1, hd[1] - 7); c.quadraticCurveTo(hd[0] + 5, hd[1] - 6.5, hd[0] + 9, hd[1] - 4); c.stroke(); }
  if (st.smile) { c.strokeStyle = '#111'; c.lineWidth = 1.5; c.beginPath(); c.arc(hd[0] + 4, hd[1] + 3, 3.5, 0.2, 2.4); c.stroke(); }
  head(c, st, hd, col, sec);
  if (f.stun > 12 && !ko) { c.fillStyle = '#ffe14d'; for (let i = 0; i < 3; i++) { const a = frame / 6 + i * 2.1; c.beginPath(); c.arc(hd[0] + Math.cos(a) * 16, hd[1] - 18 + Math.sin(a) * 4, 2.6, 0, 7); c.fill(); } }
  c.restore();
}
function limbJoint(o, l1, a) { const r = a[0] * Math.PI / 180; return [o[0] + Math.sin(r) * l1, o[1] + Math.cos(r) * l1]; }

// Headgear and face extras: all curved shapes that follow the head.
function head(c, st, hd, col, sec) {
  const hx = hd[0], hy = hd[1], dk = 'rgba(0,0,0,.55)', w = Math.sin(frame / 5);
  c.save(); c.lineWidth = 1.8; c.strokeStyle = dk;
  if (st.hood) { c.fillStyle = st.cape; c.beginPath(); c.moveTo(hx + 10, hy + 6); c.bezierCurveTo(hx + 14, hy - 8, hx + 4, hy - 16, hx - 6, hy - 14); c.bezierCurveTo(hx - 16, hy - 10, hx - 17, hy + 4, hx - 12, hy + 12); c.quadraticCurveTo(hx - 2, hy + 8, hx + 10, hy + 6); c.closePath(); c.fill(); c.stroke(); }
  if (st.mask) { c.fillStyle = '#15151c'; c.beginPath(); c.moveTo(hx - 12, hy - 2); c.bezierCurveTo(hx - 12, hy - 14, hx + 12, hy - 14, hx + 12, hy - 2); c.quadraticCurveTo(hx + 6, hy - 4, hx - 12, hy - 2); c.fill(); c.fillStyle = '#c0392b'; c.beginPath(); c.moveTo(hx - 12, hy + 1); c.quadraticCurveTo(hx, hy + 5, hx + 12, hy + 1); c.quadraticCurveTo(hx + 10, hy + 11, hx, hy + 12); c.quadraticCurveTo(hx - 10, hy + 11, hx - 12, hy + 1); c.fill(); c.strokeStyle = '#e8e8ee'; c.lineWidth = 2; c.beginPath(); c.moveTo(hx - 12, hy - 3); c.quadraticCurveTo(hx, hy - 1, hx + 12, hy - 3); c.stroke(); }
  if (st.horns) { curl(c, hx - 6, hy - 8, hx - 15, hy - 27, 3, -5, '#f0dfae'); curl(c, hx + 6, hy - 8, hx + 12, hy - 28, 3, 5, '#f0dfae'); }
  if (st.band) { c.strokeStyle = st.band; c.lineWidth = 4; c.beginPath(); c.arc(hx, hy, 11.6, Math.PI * 1.08, Math.PI * 1.92); c.stroke(); c.lineWidth = 2.6; c.beginPath(); c.moveTo(hx - 11, hy - 5); c.bezierCurveTo(hx - 20, hy - 6 + w * 2, hx - 26, hy + 1, hx - 32, hy + 3 + w * 2); c.stroke(); c.beginPath(); c.moveTo(hx - 11, hy - 6); c.bezierCurveTo(hx - 18, hy - 12 - w * 2, hx - 24, hy - 12, hx - 30, hy - 9 - w * 2); c.stroke(); }
  if (st.spikes) { curl(c, hx - 8, hy - 8, hx - 16, hy - 26, 3.2, -3, '#ffe94d'); curl(c, hx - 2, hy - 11, hx + 2, hy - 33, 3.4, 3, '#ffe94d'); curl(c, hx + 5, hy - 9, hx + 15, hy - 27, 3, 4, '#ffe94d'); }
  if (st.flames) fireCrown(c, hx, hy);
  if (st.flower) { c.fillStyle = '#ff8fb2'; for (let i = 0; i < 5; i++) { const a = i * 1.2566 + 0.3; c.beginPath(); c.ellipse(hx + 8 + Math.cos(a) * 4.4, hy - 12 + Math.sin(a) * 4.4, 3.4, 2.2, a, 0, 7); c.fill(); } c.fillStyle = '#ffe14d'; c.beginPath(); c.arc(hx + 8, hy - 12, 2, 0, 7); c.fill(); }
  if (st.ears) { curl(c, hx - 7, hy - 8, hx - 14, hy - 27, 4.6, -3, '#fff'); curl(c, hx + 5, hy - 10, hx + 12, hy - 28, 4.6, 3, '#fff'); curl(c, hx + 6, hy - 11, hx + 10, hy - 22, 2, 2, '#ffb6c1'); c.strokeStyle = 'rgba(120,160,210,.6)'; c.lineWidth = 1; c.beginPath(); c.moveTo(hx - 12, hy - 20); c.quadraticCurveTo(hx - 8, hy - 12, hx - 4, hy - 9); c.stroke(); }
  if (st.helmet) { const hc = st.trim; c.fillStyle = hc; c.beginPath(); c.moveTo(hx - 13, hy + 5); c.bezierCurveTo(hx - 15, hy - 16, hx + 14, hy - 17, hx + 13, hy + 2); c.quadraticCurveTo(hx + 10, hy - 1, hx - 13, hy + 5); c.fill(); c.stroke(); c.strokeStyle = '#20313a'; c.lineWidth = 2.6; c.beginPath(); c.moveTo(hx + 1, hy - 3); c.quadraticCurveTo(hx + 8, hy - 4, hx + 13, hy - 1.5); c.stroke(); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.6; c.beginPath(); c.arc(hx - 1, hy - 3, 10, Math.PI * 1.15, Math.PI * 1.6); c.stroke(); }
  if (st.plume) { c.fillStyle = '#5ad0b0'; c.beginPath(); c.moveTo(hx - 2, hy - 13); c.bezierCurveTo(hx - 10, hy - 26 - w, hx - 22, hy - 22 - w * 2, hx - 26, hy - 14 - w * 3); c.bezierCurveTo(hx - 16, hy - 16, hx - 8, hy - 12, hx + 3, hy - 12); c.closePath(); c.fill(); }
  if (st.halo) { c.strokeStyle = 'rgba(255,225,77,.45)'; c.lineWidth = 6; c.beginPath(); c.ellipse(hx, hy - 21, 13, 4, 0, 0, 7); c.stroke(); c.strokeStyle = '#ffe14d'; c.lineWidth = 2.6; c.beginPath(); c.ellipse(hx, hy - 21, 13, 4, 0, 0, 7); c.stroke(); }
  c.restore();
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#5aa9e6'); g.addColorStop(1, '#bfe4ff');
  ctx.fillStyle = g; ctx.fillRect(-200, -400, W + 400, H + 400);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  [[120, 70, 1], [420, 45, 1.3], [600, 100, .8]].forEach(([x, y, s]) => { const cx = ((x + frame * 0.15 * s) % (W + 200)) - 100; ctx.beginPath(); ctx.ellipse(cx, y, 44 * s, 15 * s, 0, 0, 7); ctx.ellipse(cx + 24 * s, y - 8 * s, 28 * s, 14 * s, 0, 0, 7); ctx.fill(); });
}
function drawGround() {
  ctx.fillStyle = '#6b8f4e'; ctx.fillRect(-200, GROUND - 6, W + 400, H - GROUND + 6 + 400);
  ctx.fillStyle = '#84a862'; ctx.fillRect(-200, GROUND - 6, W + 400, 5);
}
function drawFx() {
  fx = fx.filter((e) => --e.life > 0);
  fx.forEach((e) => {
    ctx.globalAlpha = Math.min(1, e.life / 14);
    if (e.k === 'text') { e.y -= 0.8; ctx.font = '800 18px sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; const rc = rgb(e.col); ctx.strokeStyle = (rc[0] * 0.3 + rc[1] * 0.6 + rc[2] * 0.1) < 90 ? '#fff' : '#000'; ctx.strokeText(e.txt, e.x, e.y); ctx.fillStyle = e.col; ctx.fillText(e.txt, e.x, e.y); }
    else if (e.k === 'spark') { e.x += e.vx; e.y += e.vy; e.vy += 0.3; ctx.fillStyle = e.col; ctx.fillRect(e.x, e.y, 4, 4); }
    else if (e.k === 'beam') { ctx.strokeStyle = e.col; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(e.x1, e.y1); const mx = (e.x1 + e.x2) / 2; ctx.lineTo(mx, e.y1 - 24); ctx.lineTo(mx + 8, e.y2 + 20); ctx.lineTo(e.x2, e.y2); ctx.stroke(); }
    else if (e.k === 'ring') { ctx.strokeStyle = e.col; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(e.x, e.y, 60 - e.life * 1.6, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
  });
}
function render() {
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  ctx.save();
  if (shake > 0) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= 0.8; if (shake < .3) shake = 0; }
  drawBackground();
  if (P) {
    // camera: zoom in as the fighters close the gap, keep the ground anchored
    const tz = Math.max(1, Math.min(1.7, 520 / (Math.abs(P.x - B.x) + 180)));
    camZ += (tz - camZ) * 0.12;
    const vw = W / camZ, cx = Math.max(0, Math.min(W - vw, (P.x + B.x) / 2 - vw / 2));
    ctx.save(); ctx.scale(camZ, camZ); ctx.translate(-cx, -(H - H / camZ)); drawGround(); ctx.fillStyle = 'rgba(0,0,0,.18)'; [P, B].forEach((f) => { ctx.beginPath(); ctx.ellipse(f.x, GROUND - 2, 28 * f.c.size * (1 - f.y / 400), 5, 0, 0, 7); ctx.fill(); }); drawFighter(ctx, P, P.x, GROUND, 1); drawFighter(ctx, B, B.x, GROUND, 1); drawFx(); ctx.restore(); }
  else drawGround();
  ctx.restore();
}

// ---------------------------------------------------------------------- HUD
function hud() {
  const set = (id, pct) => { $(id).style.width = Math.max(0, Math.min(100, pct)) + '%'; };
  set('hpP', P.hp / P.max * 100); set('hpB', B.hp / B.max * 100);
  set('enP', P.en); set('enB', B.en); set('stP', P.st); set('stB', B.st);
  $('timer').textContent = Math.max(0, Math.ceil(roundTime));
  $('abMeter').style.height = P.en + '%';
  const ready = P.en >= 100 && P.abCd === 0;
  $('abBtn').classList.toggle('ready', ready);
  $('abLabel').innerHTML = P.c.ability.name + '<small>' + (ready ? 'READY - tap!' : P.abCd > 0 ? 'cooldown ' + Math.ceil(P.abCd / 60) + 's' : Math.floor(P.en) + '% energy') + '</small>';
}

// -------------------------------------------------------------------- input
const keyMap = { a: 'left', arrowleft: 'left', d: 'right', arrowright: 'right', w: 'jump', arrowup: 'jump', ' ': 'jump', z: 'punch', j: 'punch', s: 'punch', x: 'kick', k: 'kick', c: 'block', l: 'block', arrowdown: 'block', v: 'ability', e: 'ability', r: 'ability' };
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (state === 'fight') togglePause(); return; }
  const a = keyMap[e.key.toLowerCase()]; if (!a || !P) return; e.preventDefault(); P.inp[a] = 1;
});
addEventListener('keyup', (e) => { const a = keyMap[e.key.toLowerCase()]; if (a && P && a !== 'ability') P.inp[a] = 0; });
document.querySelectorAll('.btn[data-act]').forEach((b) => {
  const a = b.dataset.act;
  const down = (e) => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ } b.classList.add('on'); if (P) P.inp[a] = 1; };
  const up = () => { b.classList.remove('on'); if (P && a !== 'ability') P.inp[a] = 0; };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
});
addEventListener('contextmenu', (e) => e.preventDefault());

// ------------------------------------------------------------------ flow
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1600); }
function overlay(html) { const o = $('overlay'); o.innerHTML = html; o.classList.add('show'); o.scrollTop = 0; }
function closeOverlay() { $('overlay').classList.remove('show'); }
function stars(v, max) { return '★'.repeat(Math.max(1, Math.round(v / max * 5))) + '☆'.repeat(5 - Math.max(1, Math.round(v / max * 5))); }

function showMenu() {
  state = 'menu';
  overlay(`<h1>1v1 Fighting</h1><div class="sub">Beat the bot, earn coins, unlock skins</div>
    <div class="coins">🪙 ${coins} coins</div>
    <div class="lvl"><div class="sub" style="margin-bottom:4px">Bot level: <b id="lvNum">${level}</b> &middot; win = <b id="lvCoins">${coinsFor(level)}</b> coins</div>
      <input type="range" id="lvSlider" min="1" max="10" step="1" value="${level}" />
      <div class="lvlab"><span>Easy</span><span>Hard</span></div></div>
    <button class="big" id="mFight">Fight Bot</button>
    <button class="big alt" id="mSkins">Skins &amp; Shop</button>
    <div class="sub" style="margin-top:14px">${touch ? 'Use the buttons under the arena' : 'A/D move · W jump · Z punch · X kick · C block · V ability'}</div>`);
  $('lvSlider').oninput = (e) => { level = +e.target.value; save('kf_level', level); $('lvNum').textContent = level; $('lvCoins').textContent = coinsFor(level); };
  $('mFight').onclick = () => startFight();
  $('mSkins').onclick = () => showSkins();
}
function skinCard(id) {
  const c = SK[id], has = owned.includes(id);
  return `<div class="card ${id === chosen ? 'picked' : ''}" data-id="${id}"><div class="tier">${c.tier}</div><canvas width="160" height="192" data-prev="${id}"></canvas>
    <div class="nm">${c.name}</div>
    <div class="stat">HP <b>${c.health}</b> · Speed <b>${stars(c.moveSpeed, 3.5)}</b></div>
    <div class="stat">Damage <b>${stars(Math.max(c.punchDamage / c.punchCooldown, Math.max(c.kickDamage * 1.3, c.punchDamage * 1.6) / (c.kickCooldown * 1.25)) * 1000, 28)}</b></div>
    <div class="stat">Atk speed <b>${stars(1000 / c.punchCooldown, 3)}</b></div>
    <div class="ab">⚡ ${c.ability.name}: ${c.ability.description}</div>
    ${has ? (id === chosen ? '<div class="own">✔ Selected</div>' : '<button class="buy" data-pick="' + id + '" style="background:#7c5cff;color:#fff">Select</button>')
          : '<button class="buy" data-buy="' + id + '" ' + (coins < PRICES[id] ? 'disabled' : '') + '>🔒 Buy · ' + PRICES[id] + '</button>'}</div>`;
}
function showSkins() {
  state = 'skins';
  overlay(`<h2>Skins &amp; Shop</h2><div class="coins">🪙 ${coins} coins</div><div id="grid">${Object.keys(SK).map(skinCard).join('')}</div>
    <button class="big" id="sBack" style="margin-top:14px">Done</button>`);
  document.querySelectorAll('canvas[data-prev]').forEach((cn) => {
    const f = makeFighter(cn.dataset.prev, 0, 1, false), c = cn.getContext('2d');
    drawFighter(c, f, 80, 176, 1.25);
  });
  document.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => { chosen = b.dataset.pick; save('kf_skin', chosen); showSkins(); });
  document.querySelectorAll('[data-buy]').forEach((b) => b.onclick = () => {
    const id = b.dataset.buy;
    if (coins >= PRICES[id]) { coins -= PRICES[id]; owned.push(id); chosen = id; save('kf_coins', coins); save('kf_owned', owned); save('kf_skin', chosen); toast('Unlocked ' + SK[id].name + '!'); showSkins(); }
  });
  $('sBack').onclick = showMenu;
}

function startFight() {
  closeOverlay();
  const pool = Object.keys(SK).filter((k) => k !== chosen);
  const botSkin = pool[Math.floor(Math.random() * pool.length)];
  P = makeFighter(chosen, W * 0.27, 1, false); B = makeFighter(botSkin, W * 0.73, -1, true);
  $('nameP').textContent = 'YOU · ' + P.c.name; $('nameB').textContent = 'BOT Lv' + level + ' · ' + B.c.name;
  botBrain = newBrain(); fx = []; roundTime = 60; paused = false;
  state = 'countdown'; countdown = 180;
}
function endRound(winner) {
  state = 'over';
  P.inp = { left: 0, right: 0, jump: 0, punch: 0, kick: 0, block: 0, ability: 0 };
  const won = winner === P;
  const prize = coinsFor(level);
  if (won) { coins += prize; save('kf_coins', coins); }
  setTimeout(() => {
    overlay(`<h1>${won ? 'YOU WIN!' : 'YOU LOSE'}</h1><div class="sub">${won ? 'Beat ' + B.c.name : B.c.name + ' got you this time'}</div>
      ${won ? '<div class="coins">+' + prize + ' coins (level ' + level + ')</div>' : ''}<div class="coins">🪙 ${coins} coins</div>
      <button class="big" id="rRe">Rematch</button><button class="big alt" id="rSk">Skins &amp; Shop</button><button class="big alt" id="rMe">Menu</button>`);
    $('rRe').onclick = startFight; $('rSk').onclick = showSkins; $('rMe').onclick = showMenu;
  }, 1100);
}
function togglePause() {
  if (state !== 'fight' && !paused) return;
  paused = !paused;
  if (paused) { overlay('<h2>Paused</h2><button class="big" id="pRes">Resume</button><button class="big alt" id="pQuit">Quit to menu</button>'); $('pRes').onclick = togglePause; $('pQuit').onclick = () => { paused = false; P = B = null; showMenu(); }; }
  else closeOverlay();
}
$('pause').onclick = togglePause;

// ---------------------------------------------------------------- main loop
function step() {
  frame++;
  if (state === 'countdown') {
    countdown--;
    const n = Math.ceil(countdown / 60);
    $('banner').textContent = countdown > 0 ? (n > 0 ? n : '') : '';
    if (countdown <= 0) { state = 'fight'; $('banner').textContent = 'FIGHT!'; setTimeout(() => { if (state === 'fight') $('banner').textContent = ''; }, 800); }
    return;
  }
  if (state !== 'fight' && state !== 'over') return;
  if (state === 'over') { $('banner').textContent = ''; }
  if (paused) return;
  if (state === 'fight') {
    roundTime -= 1 / 60;
    botControl(B, P);
    if (roundTime <= 0) endRound(P.hp / P.max >= B.hp / B.max ? P : B);
  }
  updateFighter(P, B); updateFighter(B, P); separate();
  B.inp.ability = 0; if (state === 'over') B.inp = { left: 0, right: 0, jump: 0, punch: 0, kick: 0, block: 0, ability: 0 };
}
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  if (P) hud();
  requestAnimationFrame(loop);
}

function fit() {
  const hudH = $('hud').offsetHeight, padH = document.body.classList.contains('touch') ? 156 : 0;
  const avail = innerHeight - hudH - padH - 6;
  let cw = Math.min(innerWidth - 8, 900, avail * 16 / 9);
  cw = Math.max(200, cw);
  const ch = Math.max(cw * 9 / 16, Math.min(avail, cw * 0.9));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  // narrower world on phones so fighters are drawn bigger
  W = Math.round(Math.max(440, Math.min(720, cw / 0.85))); LEFT = 30; RIGHT = W - 30;
  viewScale = cv.width / W; H = ch / cw * W; GROUND = H - 60;
  if (P && B && state !== 'fight') { P.x = W * 0.27; B.x = W * 0.73; }
}
addEventListener('resize', fit); fit();
P = makeFighter(chosen, 190, 1, false); B = makeFighter(Object.keys(SK).find((k) => k !== chosen), 530, -1, true);
showMenu();
requestAnimationFrame(loop);
</script>
