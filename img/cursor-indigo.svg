<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <defs>
    <linearGradient id="cursorIndigoGrad" x1="2" y1="2" x2="22" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cursorIndigoFacet" x1="2" y1="2" x2="14" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0e7ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e0e7ff" stop-opacity="0"/>
