<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Search</title>
  <style>
:root {
  --cursor-default: url("../img/cursors/default.svg") 2 2, default;
  --cursor-pointer: url("../img/cursors/pointer.svg") 12 3, pointer;
  --cursor-grab: url("../img/cursors/grab.svg") 16 16, grab;
  --cursor-grabbing: url("../img/cursors/grabbing.svg") 16 16, grabbing;
  --cursor-text: url("../img/cursors/text.svg") 16 16, text;
  --cursor-vertical-text: url("../img/cursors/vertical-text.svg") 16 16, vertical-text;
  --cursor-crosshair: url("../img/cursors/crosshair.svg") 16 16, crosshair;
  --cursor-cell: url("../img/cursors/cell.svg") 16 16, cell;
  --cursor-wait: url("../img/cursors/wait.svg") 16 16, wait;
  --cursor-progress: url("../img/cursors/progress.svg") 2 2, progress;
  --cursor-help: url("../img/cursors/help.svg") 2 2, help;
  --cursor-not-allowed: url("../img/cursors/not-allowed.svg") 16 16, not-allowed;
  --cursor-no-drop: url("../img/cursors/no-drop.svg") 2 2, no-drop;
  --cursor-move: url("../img/cursors/move.svg") 16 16, move;
  --cursor-all-scroll: url("../img/cursors/all-scroll.svg") 16 16, all-scroll;
  --cursor-copy: url("../img/cursors/copy.svg") 2 2, copy;
  --cursor-alias: url("../img/cursors/alias.svg") 2 2, alias;
  --cursor-context-menu: url("../img/cursors/context-menu.svg") 2 2, context-menu;
  --cursor-zoom-in: url("../img/cursors/zoom-in.svg") 13 13, zoom-in;
  --cursor-zoom-out: url("../img/cursors/zoom-out.svg") 13 13, zoom-out;
  --cursor-ew-resize: url("../img/cursors/ew-resize.svg") 16 16, ew-resize;
  --cursor-ns-resize: url("../img/cursors/ns-resize.svg") 16 16, ns-resize;
  --cursor-nwse-resize: url("../img/cursors/nwse-resize.svg") 16 16, nwse-resize;
  --cursor-nesw-resize: url("../img/cursors/nesw-resize.svg") 16 16, nesw-resize;
  --cursor-col-resize: url("../img/cursors/col-resize.svg") 16 16, col-resize;
  --cursor-row-resize: url("../img/cursors/row-resize.svg") 16 16, row-resize;
  --cursor-e-resize: var(--cursor-ew-resize);
  --cursor-w-resize: var(--cursor-ew-resize);
  --cursor-n-resize: var(--cursor-ns-resize);
  --cursor-s-resize: var(--cursor-ns-resize);
  --cursor-ne-resize: var(--cursor-nesw-resize);
  --cursor-sw-resize: var(--cursor-nesw-resize);
  --cursor-nw-resize: var(--cursor-nwse-resize);
  --cursor-se-resize: var(--cursor-nwse-resize);
}

    :root {
      --accent: #7c5cff;
      --blue: #4f8cff;
      --bg: #14151b;
      --bg-elevated: #1e1f26;
      --card: #26272f;
      --border: #34353f;
      --text: #e8e8ee;
      --text-dim: #9a9aa5;
      --link: #a99bff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(124,92,255,0.16), transparent 45%),
        radial-gradient(circle at 90% 8%, rgba(79,140,255,0.10), transparent 40%),
        var(--bg);
      color: var(--text);
    }
    #top {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px 0;
      max-width: 760px;
    }
    #logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #7c5cff, #4f8cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
      flex-shrink: 0;
    }
    #searchForm {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0 6px 0 18px;
      height: 46px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #searchForm:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,0.18); }
    #searchInput {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
    }
    .sbtn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: var(--cursor-pointer);
      font-size: 16px;
      flex-shrink: 0;
    }
    .sbtn { display: flex; align-items: center; justify-content: center; padding: 0; }
    .tabicon { display: inline-flex; vertical-align: -3px; }
    .sbtn:hover { background: var(--card); color: var(--text); }
    #searchGo { color: var(--accent); }
    .hidden { display: none !important; }

    #tabs {
      display: flex;
      gap: 4px;
      padding: 6px 20px 0;
      max-width: 760px;
      border-bottom: 1px solid var(--border);
      margin-top: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #tabs::-webkit-scrollbar { display: none; }
    .stab {
      white-space: nowrap;
      flex: none;
      padding: 10px 14px 9px;
      font-size: 14px;
      color: var(--text-dim);
      text-decoration: none;
      border-bottom: 3px solid transparent;
      cursor: var(--cursor-pointer);
      background: none;
      border-left: none; border-right: none; border-top: none;
    }
    .stab:hover { color: var(--text); }
    .stab.active { color: var(--link); border-bottom-color: var(--accent); }

    #results.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 900px; }
    .tile { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; text-decoration: none; color: var(--text); }
    .tile img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    .tile span { display: block; padding: 8px 10px; font-size: 12px; color: var(--text-dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #stats { padding: 14px 20px 0; max-width: 760px; font-size: 13px; color: var(--text-dim); }
    #answer {
      margin: 14px 20px 0;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.55;
    }

    #results {
      padding: 12px 20px 60px;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }
    .result .site { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .result .fav {
      width: 26px; height: 26px; border-radius: 50%;
      background: linear-gradient(135deg, #7c5cff, #4f8cff);
      color: white; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden;
    }
    .result .sitetext { min-width: 0; line-height: 1.25; }
    .result .sname { font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result .surl { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result a.title {
      font-size: 20px;
      line-height: 1.3;
      color: var(--link);
      text-decoration: none;
      display: block;
      margin-bottom: 3px;
    }
    .result a.title:hover { text-decoration: underline; }
    .result .snippet { font-size: 14px; color: #c3c3cd; line-height: 1.58; }

    .loading { color: var(--text-dim); font-size: 14px; padding: 6px 0; }
    .bar { height: 3px; border-radius: 3px; margin: 10px 20px 0; max-width: 720px; background: linear-gradient(90deg, #7c5cff, #4f8cff, #7c5cff); background-size: 200% 100%; animation: slide 1.1s linear infinite; }
    @keyframes slide { to { background-position: -200% 0; } }

    .state-box {
      max-width: 520px;
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.7;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 26px;
    }
    .state-box h2 { color: var(--text); font-size: 17px; margin: 0 0 8px; }
    body.ai {
      --accent: #6fa8ff;
      --bg: #0d1026;
      --bg-elevated: #17193a;
      --card: #17193a;
      --border: #2f3466;
      --text: #f2f4ff;
      --text-dim: #98a0cc;
      --link: #9cc0ff;
      background:
        radial-gradient(circle at 15% 0%, rgba(111,168,255,0.14), transparent 45%),
        radial-gradient(circle at 90% 8%, rgba(156,140,255,0.12), transparent 40%),
        var(--bg);
    }
    body.ai #logo { background: linear-gradient(135deg, #6fa8ff, #9c8cff); -webkit-background-clip: text; background-clip: text; }
    body.ai .bar { background: linear-gradient(90deg, #6fa8ff, #9c8cff, #6fa8ff); background-size: 200% 100%; }
    .aihead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-weight: 700; font-size: 16px; }
    .aidot { width: 24px; height: 24px; border-radius: 7px; background: url(igx-icon.png) center / cover; }
    .aicard { max-width: 720px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px; }
    .aicard p { margin: 0 0 12px; font-size: 15px; line-height: 1.6; }
    .aicard p:last-child { margin-bottom: 0; }
    #installbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 20px 0; max-width: 720px; padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; font-size: 14px; color: var(--text-dim); }
    #installbar.hidden { display: none; }
    #installBtn { flex: none; border: none; border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 600; color: white; background: linear-gradient(135deg, var(--accent), #8b5cf6); cursor: var(--cursor-pointer); }
    .ububble { align-self: flex-end; max-width: 85%; background: linear-gradient(135deg, var(--accent), #8b5cf6); color: white; border-radius: 18px 18px 6px 18px; padding: 10px 14px; font-size: 15px; line-height: 1.5; margin-left: auto; width: fit-content; }
    #results.chat { display: flex; flex-direction: column; gap: 12px; }
    #composer { display: flex; gap: 8px; align-items: center; position: sticky; bottom: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 6px 6px 16px; }
    #composer input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font-size: 15px; }
    #composer button { flex: none; width: 38px; height: 38px; border: none; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8b5cf6); color: white; display: flex; align-items: center; justify-content: center; cursor: var(--cursor-pointer); }
    .state-box button { margin-top: 10px; background: var(--accent); color: white; border: none; border-radius: 999px; padding: 8px 18px; font-size: 14px; cursor: var(--cursor-pointer); }
  </style>
</head>
<body>
  <div id="top">
    <a id="logo" href="kithe-search:Kithe">Kithe</a>
    <form id="searchForm">
      <input id="searchInput" type="text" placeholder="Search" spellcheck="false" autocomplete="off" />
      <button id="clearBtn" class="sbtn hidden" type="button" title="Clear">&#10005;</button>
      <button id="voiceBtn" class="sbtn hidden" type="button" title="Search with voice"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button id="searchGo" class="sbtn" type="submit" title="Search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    </form>
  </div>
  <div id="tabs">
    <button class="stab" id="allTab" type="button">All</button>
    <button class="stab" id="aiTab" type="button"><span class="tabicon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.9 5.6L18.5 10.5l-5.6 1.9L11 18l-1.9-5.6L3.5 10.5l5.6-1.9z"/><path d="M19 14.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg></span> AI Mode</button>
    <button class="stab" id="imagesTab" type="button">Images</button>
    <button class="stab" id="newsTab" type="button">News</button>
    <button class="stab" id="videosTab" type="button">Videos</button>
  </div>
  <div id="installbar" class="hidden"><span>Want IGX Assistant on your phone?</span><button id="installBtn" type="button">Install the app</button></div>
  <div id="bar" class="bar"></div>
  <div id="stats" class="hidden"></div>
  <div id="answer" class="hidden"></div>
  <div id="results"></div>

  <script>
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }
    const input = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    if (window.__voiceSearch) voiceBtn.classList.remove('hidden');
    const isAi = !!window.__aiMode || new URLSearchParams(location.search).get('ai') === '1';
    const kind = new URLSearchParams(location.search).get('kind') || 'web';
    document.body.classList.toggle('ai', isAi);
    document.getElementById('installbar').classList.toggle('hidden', !isAi);
    document.getElementById('installBtn').addEventListener('click', () => { window.location.href = 'kithe-installigx:go'; });
    document.getElementById(isAi ? 'aiTab' : kind === 'web' ? 'allTab' : kind + 'Tab').classList.add('active');
    const pendingQ = new URLSearchParams(location.search).get('q') || '';
    // The native side (not localStorage, so each tab's thread stays its
    // own) hands back this tab's earlier turns and its first question, so
    // the box and the thread survive a tab switch or an app restart intact.
    const chat = window.__aiHistory ? window.__aiHistory.slice() : [];
    const origQuery = window.__aiTopQuery || (chat[0] && chat[0].q) || pendingQ;
    input.value = isAi ? origQuery : pendingQ;
    function switchTo(target) {
      const q = isAi ? (origQuery || input.value.trim()) : input.value.trim();
      window.location.href = (target === 'web' ? 'kithe-search:' : 'kithe-' + target + ':') + encodeURIComponent(q);
    }
    for (const k of ['images', 'news', 'videos']) {
      document.getElementById(k + 'Tab').addEventListener('click', () => switchTo(k));
    }
    document.getElementById('allTab').addEventListener('click', () => switchTo('web'));
    let recorded = false;
    // The native side keeps the same Google AI Mode page open per tab, so a
    // follow-up just needs the new message; Google remembers the rest.
    function sendFollowUp(msg) {
      window.location.href = 'kithe-ai:' + encodeURIComponent(msg);
    }
    function turnsHtml() {
      return chat.map((t) => '<div class="ububble">' + escapeHtml(t.q) + '</div><div class="aicard"><div class="aihead"><div class="aidot"></div>IGX Assistant</div>'
        + String(t.a).split('\n').map((x) => x.trim()).filter(Boolean).map((x) => '<p>' + escapeHtml(x) + '</p>').join('') + '</div>').join('');
    }
    function composerHtml() {
      return '<form id="composer"><input id="composerInput" type="text" placeholder="Message IGX Assistant" autocomplete="off" spellcheck="false" /><button type="submit" title="Send"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>';
    }
    function wireComposer() {
      const f = document.getElementById('composer');
      if (!f) return;
      f.addEventListener('submit', (e) => {
        e.preventDefault();
        const msg = document.getElementById('composerInput').value.trim();
        if (msg) sendFollowUp(msg);
      });
    }

    function syncClear() { clearBtn.classList.toggle('hidden', !input.value); }
    input.addEventListener('input', syncClear);
    clearBtn.addEventListener('click', () => { input.value = ''; syncClear(); input.focus(); });
    voiceBtn.addEventListener('click', () => { window.location.href = 'kithe-voice:search'; });
    document.getElementById('aiTab').addEventListener('click', () => {
      window.location.href = 'kithe-ai:' + encodeURIComponent(input.value.trim());
    });
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (q) window.location.href = (isAi || window.__aiOn ? 'kithe-ai:' : 'kithe-search:') + encodeURIComponent(q);
    });

    function pretty(u) {
      try {
        const x = new URL(u);
        const parts = x.pathname.split('/').filter(Boolean);
        return x.hostname.replace(/^www\./, '') + (parts.length ? ' › ' + parts.join(' › ') : '');
      } catch (e) { return u; }
    }
    function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }

    window.__kitheRender = render;
    function render() {
      const state = window.__searchState;
      const resultsEl = document.getElementById('results');
      const bar = document.getElementById('bar');
      if (!state) {
        if (isAi && pendingQ) {
          resultsEl.classList.add('chat');
          resultsEl.innerHTML = turnsHtml() + '<div class="ububble">' + escapeHtml(pendingQ) + '</div><div class="loading">Thinking…</div>';
        } else {
          resultsEl.innerHTML = '<div class="loading">' + (isAi ? 'Thinking…' : 'Searching…') + '</div>';
        }
        setTimeout(render, 80);
        return;
      }
      bar.classList.add('hidden');
      input.value = isAi ? origQuery : (state.query || '');
      syncClear();

      const statsEl = document.getElementById('stats');
      if (state.stats) { statsEl.textContent = state.stats; statsEl.classList.remove('hidden'); }
      const answerEl = document.getElementById('answer');
      if (state.answer && !isAi) { answerEl.textContent = state.answer; answerEl.classList.remove('hidden'); }

      if (isAi) {
        resultsEl.classList.add('chat');
        if (!state.query) {
          resultsEl.innerHTML = '<div class="state-box"><h2>AI Mode</h2>Ask anything and the IGX Assistant will answer.</div>';
          return;
        }
        if (state.error) {
          resultsEl.innerHTML = turnsHtml() + `<div class="ububble">${escapeHtml(state.query)}</div><div class="state-box"><h2>No answer</h2>${escapeHtml(state.error)}<br><button id="retry" type="button">Try again</button></div>` + composerHtml();
          document.getElementById('retry').addEventListener('click', () => sendFollowUp(state.query));
          wireComposer();
          return;
        }
        if (state.partial) {
          const paras = String(state.answer || '').split('\n').map((x) => x.trim()).filter(Boolean);
          resultsEl.innerHTML = turnsHtml() + '<div class="ububble">' + escapeHtml(state.query) + '</div><div class="aicard"><div class="aihead"><div class="aidot"></div>IGX Assistant</div>'
            + paras.map((x) => '<p>' + escapeHtml(x) + '</p>').join('') + '</div>';
          return;
        }
        if (!recorded) {
          recorded = true;
          chat.push({ q: state.query, a: String(state.answer || '') });
        }
        resultsEl.innerHTML = turnsHtml() + composerHtml();
        wireComposer();
        return;
      }

      if (state.error) {
        resultsEl.innerHTML = `<div class="state-box"><h2>Search failed</h2>${escapeHtml(state.error)}<br><button id="retry" type="button">Try again</button></div>`;
        document.getElementById('retry').addEventListener('click', () => { window.location.href = 'kithe-' + (kind === 'web' ? 'search' : kind) + ':' + encodeURIComponent(state.query || ''); });
        return;
      }

      if (!state.results || state.results.length === 0) {
        resultsEl.innerHTML = `<div class="state-box"><h2>No results</h2>Try a different search.</div>`;
        return;
      }

      resultsEl.classList.toggle('grid', kind === 'images');
      if (kind === 'images') {
        resultsEl.innerHTML = state.results.map((r) => `
          <a class="tile" href="${escapeHtml(r.url)}"><img src="${escapeHtml(r.thumb)}" alt="" loading="lazy" /><span>${escapeHtml(r.title)}</span></a>`).join('');
        return;
      }

      resultsEl.innerHTML = state.results.map((r) => {
        const h = host(r.url);
        const site = r.site || (/(^|\.)google\.[a-z.]+$/.test(h) ? '' : h);
        const disp = /google\.[a-z.]+\/goto/.test(r.url) ? '' : (r.display || pretty(r.url));
        return `
        <div class="result">
          <div class="site">
            <div class="fav">${escapeHtml((site[0] || (r.title || '?')[0] || '?').toUpperCase())}</div>
            <div class="sitetext"><div class="sname">${escapeHtml(site)}</div><div class="surl">${escapeHtml(disp)}</div></div>
          </div>
          <a class="title" href="${escapeHtml(r.url)}">${escapeHtml(r.title)}</a>
          <div class="snippet">${escapeHtml(r.snippet || '')}</div>
        </div>`;
      }).join('');
    }
    render();
  </script>
</body>
</html>
